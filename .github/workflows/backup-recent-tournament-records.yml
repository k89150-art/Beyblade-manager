name: Backup Recent Tournament Records

# Phase 6C: the direct restore to the live document (restore_to_main) is
# disabled. It overwrote users/{uid}/appData/main.tournamentRecords with no
# typed confirmation, no backup of the current value and no precondition, so
# newer records could be lost. This workflow now only reads the live document
# and writes private copies under users/{uid}/recovery/. A future restore must
# be a separate, reviewed workflow (typed confirmation, backup of the current
# value first, updateTime precondition, explicit backup_id only).
# See docs/AI_HANDOFF.md (Phase 6C).

on:
  workflow_dispatch:
    inputs:
      uid:
        description: Firebase Auth UID to inspect
        required: true
        default: SesDhvXG6MUT38YhqGl0N6lVgMz1
      scan_minutes:
        description: Number of recent minutes to scan (maximum 59)
        required: true
        default: "59"
      backup_id:
        description: Existing private recovery document to inspect (read-only, optional)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Find and preserve the newest retained tournament data
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_K89150_WEB_LOGIN }}
          TARGET_UID: ${{ inputs.uid }}
          SCAN_MINUTES: ${{ inputs.scan_minutes }}
          BACKUP_ID: ${{ inputs.backup_id }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          project = "k89150-web-login"
          uid = os.environ["TARGET_UID"].strip()
          scan_minutes = min(59, max(1, int(os.environ["SCAN_MINUTES"])))
          account_info = json.loads(os.environ["SERVICE_ACCOUNT_JSON"])
          credentials = service_account.Credentials.from_service_account_info(
              account_info,
              scopes=["https://www.googleapis.com/auth/datastore"],
          )
          credentials.refresh(Request())
          token = credentials.token
          base = f"https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents"
          source_path = f"users/{uid}/appData/main"
          source_url = f"{base}/{source_path}"
          headers = {"Authorization": f"Bearer {token}"}
          now = datetime.datetime.now(datetime.timezone.utc)
          found = None
          existing_backup_id = os.environ.get("BACKUP_ID", "").strip()

          # The only write this workflow may make: a private copy under
          # users/{uid}/recovery/. The live appData document is never written.
          recovery_prefix = f"{base}/users/{uid}/recovery/"

          def write_recovery_document(url, body):
              if not url.startswith(recovery_prefix) or "/appData/" in url or "updateMask" in url:
                  raise SystemExit(f"Refusing to write outside the private recovery collection: {url}")
              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode("utf-8"),
                  headers={**headers, "Content-Type": "application/json"},
                  method="PATCH",
              )
              with urllib.request.urlopen(request) as response:
                  json.load(response)

          if existing_backup_id:
              backup_url = f"{base}/users/{uid}/recovery/{existing_backup_id}"
              request = urllib.request.Request(backup_url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  backup_document = json.load(response)
              field = backup_document.get("fields", {}).get("tournamentRecords")
              values = (field or {}).get("arrayValue", {}).get("values", [])
              if values:
                  recovered_from = backup_document.get("fields", {}).get(
                      "recoveredFrom", {}
                  ).get("timestampValue", "private backup")
                  found = (recovered_from, field, len(values))
          else:
              for seconds_back in range(30, scan_minutes * 60 + 1, 30):
                  read_time = (now - datetime.timedelta(seconds=seconds_back)).isoformat(
                      timespec="microseconds"
                  ).replace("+00:00", "Z")
                  url = source_url + "?" + urllib.parse.urlencode({"readTime": read_time})
                  request = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(request) as response:
                          document = json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          continue
                      raise

                  field = document.get("fields", {}).get("tournamentRecords")
                  values = (field or {}).get("arrayValue", {}).get("values", [])
                  if values:
                      found = (read_time, field, len(values))
                      break

          if not found:
              if existing_backup_id:
                  print(f"Private backup {existing_backup_id} has no tournament records.")
              else:
                  print(f"No retained tournament records found in the last {scan_minutes} minutes.")
              raise SystemExit(0)

          read_time, tournament_field, record_count = found

          if existing_backup_id:
              backup_id = existing_backup_id
              print(f"Loaded {record_count} tournament record(s) from private backup {backup_id}.")
          else:
              backup_id = "tournament-" + now.strftime("%Y%m%d-%H%M%S")
              backup_url = f"{base}/users/{uid}/recovery/{backup_id}"
              body = {
                  "fields": {
                      "tournamentRecords": tournament_field,
                      "recoveredFrom": {"timestampValue": read_time},
                      "recoveredAt": {
                          "timestampValue": now.isoformat(timespec="microseconds").replace("+00:00", "Z")
                      },
                      "sourceDocument": {"stringValue": source_path},
                  }
              }
              write_recovery_document(backup_url, body)
              print(f"Preserved {record_count} tournament record(s) in private backup {backup_id}.")
              print(f"Recovered source timestamp: {read_time}")

          # Restore to the live document is disabled (Phase 6C); see the header.
          print("Live document not modified: the direct restore is disabled (Phase 6C).")
          PY
