name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production modules
        run: npm run build

      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.phase1-test/' \
            --exclude='coverage/' \
            --exclude='tests/' \
            --exclude='src/' \
            --exclude='scripts/' \
            --exclude='_site/' \
            --exclude='*.md' \
            --exclude='package*.json' \
            --exclude='tsconfig*.json' \
            --exclude='eslint.config.js' \
            ./ _site/
          rm -f \
            _site/evidence-mvp.html \
            _site/evidence-mvp.css \
            _site/dist/meta/evidence/evidence-page.js \
            _site/dist/meta/evidence/seed.js \
            _site/dist/meta/integration/development-environment.js
          find _site/dist -type f \( \
            -name '*.map' -o \
            -name '*.d.ts' \
          \) -delete

      - name: Generate public Firebase config
        env:
          META_DATA_MODE: production
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          META_ADMIN_UIDS: ${{ vars.META_ADMIN_UIDS }}
        run: node scripts/generate-meta-firebase-config.mjs --mode production --output _site/firebase-meta-config.js

      - name: Verify release artifact
        run: node scripts/verify-release-artifact.mjs --root _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
