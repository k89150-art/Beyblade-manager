  <title>參賽紀錄｜戰鬥陀螺管理表</title>

  <link rel="stylesheet" href="style.css?v=20260902-v192" />
  <link rel="stylesheet" href="site-menu.css?v=20261124-v1100" />
  <style>
    .side-menu-button { position: fixed; left: 14px; top: 14px; z-index: 1200; width: 44px; height: 44px; border-radius: 12px; background: #242424; color: #ffffff; border: 1px solid #444; font-size: 22px; font-weight: 700; line-height: 1; box-shadow: 0 8px 22px rgba(0,0,0,0.35); }
    .side-menu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.62); z-index: 1300; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .side-menu { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; max-width: 82vw; background: #161616; border-right: 1px solid #333; z-index: 1301; transform: translateX(-100%); transition: transform 0.22s ease; box-shadow: 12px 0 32px rgba(0,0,0,0.55); padding: 18px; box-sizing: border-box; overflow-y: auto; }
    body.side-menu-open .side-menu-backdrop { opacity: 1; pointer-events: auto; }
    body.side-menu-open .side-menu { transform: translateX(0); }
    .side-menu-title { color: #ffffff; font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .side-menu-subtitle { color: #999; font-size: 13px; line-height: 1.5; margin-bottom: 18px; }
    .side-menu-section { color: #8d8d8d; font-size: 12px; font-weight: 700; margin: 16px 0 8px; }
    .side-menu-link { display: block; text-decoration: none; color: #e8e8e8; background: #202020; border: 1px solid #333; border-radius: 10px; padding: 12px 13px; margin-bottom: 10px; font-size: 15px; font-weight: 700; }
    .side-menu-link:hover { background: #2a2a2a; }
    .side-menu-link.active { border-color: #3d7eff; background: rgba(61,126,255,0.18); color: #ffffff; }
    .side-menu-close { width: 100%; margin-top: 8px; }
    .page-nav { margin: -6px 0 18px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-link { display: inline-flex; align-items: center; justify-content: center; padding: 9px 14px; text-decoration: none; min-height: 38px; box-sizing: border-box; }
    .tournament-form { display: grid; grid-template-columns: 150px 1fr 1fr 120px 1fr 120px; gap: 8px; background: #181818; padding: 12px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #333; }
    .tournament-form input, .tournament-form button { width: 100%; min-width: 0; max-width: 100%; }
    .tournament-form input[type="date"] { inline-size: 100%; min-inline-size: 0; max-inline-size: 100%; }
    .tournament-list { display: flex; flex-direction: column; gap: 14px; }
    .tournament-card { background: #181818; border: 1px solid #333; border-radius: 12px; overflow: hidden; }
    .tournament-summary { display: flex; justify-content: space-between; gap: 12px; padding: 14px; background: #1d1d1d; }
    .tournament-summary-main { min-width: 0; }
    .tournament-title { color: #ffffff; font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .tournament-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: #cfcfcf; font-size: 13px; line-height: 1.5; }
    .tournament-note { margin-top: 6px; color: #bdbdbd; font-size: 13px; line-height: 1.5; }
    .tournament-actions, .match-actions { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
    .tournament-actions button, .match-actions button { padding: 7px 10px; font-size: 12px; }
    .tournament-detail { padding: 14px; border-top: 1px solid #333; }
    .tournament-detail h4 { color: #ffffff; margin: 4px 0 10px 0; font-size: 16px; }
    .tournament-detail h5 { color: #dcdcdc; margin: 12px 0 8px 0; font-size: 14px; }
    .match-form { display: grid; grid-template-columns: 1fr; gap: 10px; background: #151515; border: 1px solid #303030; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
    .direct-advance-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .direct-advance-note { color: #9ba8b5; font-size: 12px; line-height: 1.6; }
    .direct-advance-badge { display: inline-flex; align-items: center; min-height: 25px; padding: 2px 8px; border: 1px solid rgba(61,126,255,.42); border-radius: 999px; color: #86b6ff; background: rgba(61,126,255,.09); font-size: 11px; font-weight: 800; }
    .deck-input-group { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 8px; align-items: center; }
    .deck-input-group label { color: #dcdcdc; font-size: 13px; font-weight: 700; }
    .match-card { background: #151515; border: 1px solid #303030; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .match-header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
    .match-title { color: #ffffff; font-size: 15px; font-weight: 700; margin-bottom: 5px; }
    .match-score { color: #dcdcdc; font-size: 13px; }
    .deck-list { display: grid; gap: 6px; background: #1d1d1d; border: 1px solid #333; border-radius: 8px; padding: 10px; color: #d2d2d2; font-size: 13px; line-height: 1.5; }
    .round-form { display: grid; grid-template-columns: 1.4fr 110px 150px 1fr 100px; gap: 8px; margin-bottom: 10px; }
    .round-form select, .round-form input, .round-form button { width: 100%; }
    .round-table-wrap { margin-bottom: 0; }
    .round-table { min-width: 760px; }
    .score-badge, .win-text, .lose-text, .progress-text { font-weight: 700; }
    .win-text { color: #69db7c; }
    .lose-text { color: #ff8787; }
    .progress-text { color: #ffcc66; }
    .empty-state { background: #181818; border: 1px solid #333; border-radius: 10px; padding: 12px; color: #bdbdbd; font-size: 14px; line-height: 1.5; }
    @media (max-width: 900px) { .tournament-form { grid-template-columns: repeat(2, 1fr); } .round-form { grid-template-columns: repeat(2, 1fr); } .tournament-summary, .match-header { flex-direction: column; } .tournament-actions, .match-actions { width: 100%; justify-content: flex-start; } }
    @media (max-width: 600px) { .side-menu-button { left: 10px; top: 10px; width: 42px; height: 42px; } .auth-card { margin-top: 56px; } .page-nav { flex-direction: column; } .nav-link { width: 100%; } .tournament-form, .match-form, .round-form { display: flex; flex-direction: column; gap: 8px; } .direct-advance-actions { grid-template-columns: 1fr; } .deck-input-group { display: flex; flex-direction: column; align-items: stretch; gap: 6px; } .tournament-actions button, .match-actions button { min-height: 38px; } .tournament-card, .match-card { border-radius: 8px; } }
    @media (max-width: 700px) {
      .tournament-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .match-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tournament-actions button, .match-actions button { width: auto; min-width: 0; margin: 0; }
      .round-table-wrap { overflow: visible; border: 0; background: transparent; box-shadow: none; }
      .round-table { min-width: 0; display: block; background: transparent; }
      .round-table thead { display: none; }
      .round-table tbody { display: grid; gap: 8px; }
      .round-table tbody tr {
        padding: 10px 12px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0 12px;
        border: 1px solid #303a45;
        border-radius: 8px;
        background: #10161d;
      }
      .round-table td {
        min-width: 0;
        min-height: 32px;
        padding: 6px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 0;
        border-bottom: 1px solid #26313d;
        white-space: normal;
        text-align: right;
        word-break: break-word;
      }
      .round-table td::before { flex: 0 0 auto; color: #778594; font-size: 10px; font-weight: 900; }
      .round-table td:nth-child(1)::before { content: "回合"; }
      .round-table td:nth-child(2)::before { content: "使用陀螺"; }
      .round-table td:nth-child(3)::before { content: "結果"; }
      .round-table td:nth-child(4)::before { content: "得分方式"; }
      .round-table td:nth-child(5)::before { content: "分數"; }
      .round-table td:nth-child(6)::before { content: "備註"; }
      .round-table td:nth-child(7)::before { content: "操作"; }
      .round-table td:nth-child(2), .round-table td:nth-child(6), .round-table td:nth-child(7), .round-table td[colspan] { grid-column: 1 / -1; }
      .round-table td:last-child { border-bottom: 0; }
      .round-table td[colspan] { justify-content: center; text-align: center; }
      .round-table td[colspan]::before, .round-table td.round-action-empty { display: none; }
      .round-table td button { width: 100%; margin: 0; }
    }
    /* ===== Phase 7-4 tournament record panel (approved C large buttons) ===== */
    .tp-arena { margin: 4px 0 18px; padding: 14px; border-radius: 14px; background: #0f141a; border: 1px solid #2c3540; color: #e8eef5; display: grid; gap: 12px; }
    .tp-empty, .tp-card-note { margin: 0; color: #aab4bf; font-size: 14px; }
    .tp-board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px; align-items: center; text-align: center; }
    .tp-side { display: grid; gap: 4px; justify-items: center; }
    .tp-side > span { font-size: 13px; color: #aab4bf; font-weight: 700; }
    .tp-side strong { font-size: 54px; line-height: 1; font-weight: 900; }
    .tp-me strong { color: #4cd38a; }
    .tp-op strong { color: #ff7b7b; }
    .tp-pips { display: flex; gap: 4px; }
    .tp-pip { width: 14px; height: 6px; border-radius: 3px; background: #2c3540; }
    .tp-me .tp-pip.is-on { background: #4cd38a; }
    .tp-op .tp-pip.is-on { background: #ff7b7b; }
    .tp-mid { display: grid; gap: 4px; font-size: 13px; color: #c8d1db; overflow-wrap: anywhere; }
    .tp-mid strong { font-size: 15px; color: #fff; }
    .tp-status { margin: 0; font-size: 13px; color: #c8d1db; }
    .tp-switch { display: grid; gap: 4px; font-size: 13px; color: #aab4bf; }
    .tp-switch select { min-height: 44px; width: 100%; }
    .tp-group { display: grid; gap: 6px; }
    .tp-label { font-size: 13px; color: #aab4bf; font-weight: 700; }
    .tp-bigs { display: grid; gap: 8px; }
    .tp-beys { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .tp-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tp-four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tp-arena .tp-big:hover { border-color: #5b6878; background: #212b36; color: #fff; }
    .tp-arena .tp-big { min-height: 52px; padding: 8px 10px; border-radius: 10px; border: 1px solid #3a4552; background: #1a222c; color: #e8eef5; font-size: 15px; font-weight: 800; display: grid; place-items: center; gap: 2px; overflow-wrap: anywhere; text-align: center; }
    .tp-arena .tp-big small { font-size: 12px; font-weight: 700; color: #aab4bf; }
    .tp-arena .tp-big[aria-pressed="true"] { border-color: #4a93ff; background: #1f4f9a; color: #fff; }
    .tp-arena .tp-big[aria-pressed="true"] small { color: #dce8ff; }
    .tp-arena .tp-big.tp-win[aria-pressed="true"] { border-color: #4cd38a; background: #1d6b45; }
    .tp-arena .tp-big.tp-lose[aria-pressed="true"] { border-color: #ff7b7b; background: #8a2e33; }
    .tp-arena .tp-big:focus-visible, .tp-go:focus-visible, .tp-target-btn:focus-visible { outline: 3px solid #ffcc66; outline-offset: 2px; }
    .tp-note { display: grid; gap: 4px; font-size: 13px; color: #aab4bf; }
    .tp-note input { min-height: 44px; }
    .tp-preview { margin: 0; font-size: 14px; color: #ffcc66; min-height: 1.4em; }
    .tp-message { margin: 0; font-size: 14px; color: #ff8787; min-height: 0; }
    .tp-message:empty { display: none; }
    .tp-go { min-height: 52px; font-size: 16px; }
    .tp-done { margin: 0; padding: 12px; border-radius: 10px; background: #1a222c; border: 1px dashed #4cd38a; color: #dfe7ee; font-size: 14px; line-height: 1.6; }
    .tp-recent ol { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
    .tp-recent li { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 6px 8px; border-radius: 8px; background: #161d25; }
    @media (max-width: 700px) {
      .tp-arena { padding: 12px; }
      .tp-side strong { font-size: 44px; }
      .tp-four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tp-beys { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <div id="authArea" class="auth-card">
    <div class="auth-main">
      <div>
        <div class="auth-title">參賽紀錄雲端同步</div>

        <div id="userInfo" class="auth-user" style="display:none;">
          已登入：<strong id="userEmail"></strong>
        </div>

        <div id="syncStatus" class="auth-status status-muted">
          尚未登入
        </div>
        <div id="tournamentClientVersion" class="auth-status status-muted" style="font-size:12px;" hidden></div>
      </div>

      <div class="auth-actions">
        <button id="retryDataLoadBtn" type="button" class="secondary-btn" hidden>重新載入</button>
        <button id="googleLoginBtn" class="primary-btn">使用 Google 登入</button>
        <button id="logoutBtn" class="danger-btn" style="display:none;">登出</button>
      </div>
    </div>
  </div>

  <div class="container">
    <h2>參賽紀錄</h2>

    <div class="history-note">
      這裡可以記錄每場比賽、總人數、對手局、直接晉級與每回合得失分；系統會依單敗淘汰賽程自動計算最終成績。
    </div>

    <h3>新增比賽</h3>

    <div class="tournament-form">
      <input type="date" id="tournamentDate">
      <input type="text" id="tournamentName" placeholder="比賽名稱">
      <input type="text" id="tournamentLocation" placeholder="地點">
      <input type="number" id="tournamentParticipantCount" min="2" step="1" inputmode="numeric" placeholder="總人數（含自己）">
      <input type="text" id="tournamentNote" placeholder="備註">
      <button type="button" data-write-action disabled onclick="addTournament()" class="primary-btn">新增比賽</button>
    </div>

    <h3>比賽列表</h3>

    <div id="tournamentList" class="tournament-list"></div>
  </div>

  <script>
    function openSideMenu() {
