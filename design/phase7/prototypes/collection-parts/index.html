  --bx: #2f6fd6; --ux: #7d4cc9; --cx: #c4621d;

:root[data-theme="light"] {

  --text: #2b2620; --muted: #776b5c; --accent: #2f6fd6; --accent-text: #ffffff;
  --bx: #2f6fd6; --ux: #7d4cc9; --cx: #c4621d;

body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5;

.topbar h2 { font-size: 20px; }

.btn { min-height: 40px; border: 1px solid var(--line); background: var(--raised); border-radius: var(--r-md); padding: 0 14px; font-weight: 700; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card { text-align: left; border: 1px solid var(--line); background: var(--raised); border-radius: var(--r-md); padding: 11px 12px; display: grid; gap: 6px; min-height: var(--touch); }

.ok { color: var(--good); } .zero { color: var(--warn); } .over { color: var(--bad); }
.prow { grid-template-columns: minmax(0,1fr) auto; }

.summary small { color: var(--muted); font-size: 11.5px; }

// ---------- 狀態 ----------

// ---------- 計算（對應 getTotalParts／getUsedParts；CX 上蓋不計、CX 配置的組合上蓋不計） ----------
const key = (t, n) => t + "|" + n;
function holdings({ excludeStock = [], extraOverride = null } = {}) {
  const m = new Map();
  const add = (t, n, field, c) => { const k = key(t, n); const v = m.get(k) || { type: t, name: n, orig: 0, extra: 0, extraIds: [] }; v[field] += c; m.set(k, v); return v; };
  COLLECTION.forEach(b => { if (excludeStock.includes(b.id)) return; b.parts.forEach(([t, n]) => add(t, n, "orig", 1)); });
  EXTRA.forEach(p => {
    const o = extraOverride && extraOverride.id === p.id ? extraOverride : null;
    const t = o?.type ?? p.type, n = o?.name ?? p.name, c = o ? o.count : p.count;
    if (c > 0) { const v = add(t, n, "extra", c); v.extraIds.push(p.id); }
  });
  return m;
}
function used() {
  const m = new Map();
  CONFIGS.forEach(c => c.parts.forEach(([t, n]) => { if (c.cx && t === "上蓋") return; m.set(key(t, n), (m.get(key(t, n)) || 0) + 1); }));
  return m;
}
function partRows(h = holdings()) {
  const u = used();
  return [...h.values()].map(v => { const ref = u.get(key(v.type, v.name)) || 0; return { ...v, ref, held: v.orig + v.extra, avail: v.orig + v.extra - ref }; });
}
function orphanRefs(h = holdings()) {
  const out = [];
  used().forEach((ref, k) => { if (!h.has(k)) { const [t, n] = k.split("|"); out.push({ t, n, ref, configs: configsUsing(t, n) }); } });
  return out;
}
function configsUsing(t, n) { return CONFIGS.filter(c => c.parts.some(([pt, pn]) => pt === t && pn === n && !(c.cx && pt === "上蓋"))).map(c => c.name); }
// vanished：變更後持有中已完全沒有這個名稱。刪除／減量時算「不足（持有 0）」；改名時改列為「找不到對應」（newOrphans）。
function shortages(h, { countVanished = true } = {}) {
  const u = used(), base = holdings(), out = [];
  u.forEach((ref, k) => {
    const v = h.get(k);
    if (!v && (!countVanished || !base.has(k))) return;
    const held = v ? v.orig + v.extra : 0;
    if (ref > held) { const [t, n] = k.split("|"); out.push({ t, n, ref, held, configs: configsUsing(t, n) }); }
  });
  return out;
}
function newShortages(h, opts) { const before = new Set(shortages(holdings()).map(o => key(o.t, o.n))); return shortages(h, opts).filter(o => !before.has(key(o.t, o.n))); }
function newOrphans(h) { const before = new Set(orphanRefs().map(o => key(o.t, o.n))); return orphanRefs(h).filter(o => !before.has(key(o.t, o.n))); }
const reliableEn = b => b.auto && b.rid; // S1

// ---------- 篩選與排序（正式網站：只作用在顯示層，原始 <tr> 不動） ----------
function stockView() {
  const q = S.q.trim().toLowerCase();
  let rows = COLLECTION.filter(b => (S.series === "all" || b.series === S.series) && (S.source === "all" || (S.source === "auto") === b.auto))
    .filter(b => !q || [b.code, b.zh, ...b.parts.map(p => p[1]), S.S === "S1" && reliableEn(b) ? b.en : ""].join(" ").toLowerCase().includes(q));
  const cmp = {
    default: (a, b) => (SERIES_ORDER[a.series] - SERIES_ORDER[b.series]) || a.code.localeCompare(b.code, "zh-Hant", { numeric: true }),
    code: (a, b) => a.code.localeCompare(b.code, "zh-Hant", { numeric: true }),
    name: (a, b) => a.zh.localeCompare(b.zh, "zh-Hant")
  }[S.sort];
  rows = [...rows].sort(cmp);
  if (S.G === "G1") {
    const groups = new Map();
    rows.forEach(b => { const k = b.code + "|" + b.parts.map(p => p.join(":")).join("|"); if (!groups.has(k)) groups.set(k, { ...b, members: [] }); groups.get(k).members.push(b.id); });
    return [...groups.values()];
  }
  return rows.map(b => ({ ...b, members: [b.id] }));
}
function partView() {
  const q = S.pq.trim().toLowerCase();
  let rows = partRows();
  if (S.P === "P1") rows = rows.filter(r => r.extra > 0);
  rows = rows.filter(r => S.ptype === "all" || (S.ptype === "CX" ? CX_TYPES.includes(r.type) : r.type === S.ptype))
    .filter(r => S.pstatus === "all" || (S.pstatus === "ok" ? r.avail > 0 : S.pstatus === "zero" ? r.avail === 0 : r.avail < 0))
    .filter(r => !q || (r.type + " " + r.name).toLowerCase().includes(q));
  const cmp = {
    default: (a, b) => (TYPES.indexOf(a.type) - TYPES.indexOf(b.type)) || a.name.localeCompare(b.name, "zh-Hant", { numeric: true }),
    name: (a, b) => a.name.localeCompare(b.name, "zh-Hant", { numeric: true }),
    avail: (a, b) => a.avail - b.avail
  }[S.psort];
  return [...rows].sort(cmp);
}

  const extraRows = EXTRA.filter(p => r.extraIds.includes(p.id));
  const editor = S.edit && extraRows.some(p => p.id === S.edit.id) ? `<div class="box editing"><h4>修改額外零件（原始列進入編輯狀態）</h4>
      <div class="addrow"><select id="editType" aria-label="類別">${TYPES.map(t => `<option ${t === S.edit.type ? "selected" : ""}>${t}</option>`).join("")}</select><input id="editName" value="${esc(S.edit.name)}" aria-label="零件名稱"></div>
      <div class="actions"><span class="stepper"><button data-act="dec" aria-label="減少">−</button><b class="num">${S.edit.count}</b><button data-act="inc" aria-label="增加">＋</button></span><button class="btn primary" data-act="save-edit">保存</button><button class="btn" data-act="cancel-edit">取消</button></div>
      <span class="hint">輸入只同步到原始列的輸入框；保存與取消走既有 saveEditRow／cancelEditRow 與它們的確認訊息。Esc＝取消。</span></div>` : "";
  return `<div style="display:grid;gap:4px"><span class="typepill" style="justify-self:start">${esc(r.type)}</span><h3>${esc(r.name)}</h3></div>
    <div class="summary"><div><small>原裝內含</small><b>${r.orig}</b></div><div><small>額外持有</small><b>${r.extra}</b></div><div><small>配置引用</small><b>${r.ref}</b></div><div><small>${r.avail < 0 ? "超用" : "可用"}</small><b class="${numCls(r.avail)}">${Math.abs(r.avail)}</b></div></div>
    ${r.avail < 0 ? `<div class="impact"><b>配置引用比持有多 ${-r.avail} 個。</b><span>只提示，不會阻擋或自動修改配置。</span></div>` : ""}
    <div class="box"><h4>引用這個零件的配置（${refs.length}）</h4>${refs.length ? `<ul class="refs">${refs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<span class="hint">沒有配置使用。</span>`}</div>
    ${r.orig ? `<div class="src">原裝內含 ${r.orig} 個會隨原裝陀螺變動，不能在這裡修改。</div>` : ""}
    ${extraRows.length ? `<div class="box"><h4>額外持有（${extraRows.length} 筆資料）</h4>${extraRows.map(p => `<div class="actions" style="align-items:center"><span>數量 <b class="num">${p.count}</b></span><button class="btn" data-act="edit-part" data-id="${p.id}">修改</button><button class="btn danger" data-act="del-part" data-id="${p.id}">刪除</button></div>`).join("")}</div>${editor}` : `<div class="src">沒有額外持有可修改或刪除。</div>`}`;
}

// ---------- 主畫面 ----------
function sideHtml() {
  const on = S.tab;
  return `<nav class="side" aria-label="主要導覽"><div class="brand">戰鬥陀螺管理表</div><button class="side-add" data-act="qmenu" aria-haspopup="menu" aria-expanded="${S.qmenu}">＋ 新增</button>
    <small>主要功能</small><a href="#" data-go="stock" class="${on === "stock" ? "on" : ""}">收藏</a><a href="#" data-go="part" class="child ${on === "part" ? "on" : ""}">零件</a><a href="#" data-noop>配置紀錄</a><a href="#" data-noop>賽事</a>
    <small>參考</small><a href="#" data-noop>競賽統計</a><small>工具</small><a href="#" data-noop>建立配置（Quick Editor）</a></nav>`;
}
function partCount() { return partRows().filter(r => S.P === "P2" || r.extra > 0).length; }
function tabsHtml() {
  if (S.T === "T2") return `<div class="anchors"><button data-anchor="secStock">原裝陀螺 ${COLLECTION.length}</button><button data-anchor="secPart">零件 ${partCount()}</button><span class="hint" style="align-self:center">T2（未採用）：兩區段上下排列</span></div>`;
  return `<div class="tabs" role="tablist" aria-label="收藏分頁"><button class="tab" role="tab" data-go="stock" aria-selected="${S.tab === "stock"}" tabindex="${S.tab === "stock" ? 0 : -1}">原裝陀螺 <span class="cnt">${COLLECTION.length}</span></button><button class="tab" role="tab" data-go="part" aria-selected="${S.tab === "part"}" tabindex="${S.tab === "part" ? 0 : -1}">零件 <span class="cnt">${partCount()}</span></button></div>`;
}
function mainHtml() {
  let toolbar = "", body = "";
  if (S.T === "T2") {
    body = `<h3 class="section-h" id="secStock">原裝陀螺</h3>${stockToolbar()}${stockBody()}<h3 class="section-h" id="secPart">零件</h3>${partToolbar()}${partBody()}`;
  } else {
    toolbar = S.tab === "stock" ? stockToolbar() : partToolbar();
    body = S.tab === "stock" ? stockBody() : partBody();
  }
  return `<main class="main"><div class="topbar"><h2>收藏</h2><span class="sync"><i></i>已同步（原型）</span></div>${tabsHtml()}<div>${toolbar}</div><div class="scroll" id="scroller">${body}</div></main>`;
}
function bnavHtml() {
  return `<nav class="bnav" aria-label="底部導覽"><button class="on" data-go="${S.tab}"><b>C</b>收藏</button><button data-noop><b>X</b>配置</button><button class="plus" data-act="qmenu" aria-haspopup="menu" aria-expanded="${S.qmenu}"><b>＋</b>新增</button><button data-noop><b>3G</b>賽事</button><button data-noop><b>⋯</b>更多</button></nav>`;
}
function overlays() {
  let h = "";
  if (S.qmenu) h += `<div class="scrim" data-act="close-q"></div><div class="qmenu" role="menu" aria-label="快速新增">
    <button role="menuitem" data-act="q-stock">新增收藏<small>切到原裝陀螺並聚焦型號</small></button><button role="menuitem" data-act="q-part">新增零件<small>切到零件並聚焦名稱</small></button>
    <button role="menuitem" data-noop>建立配置<small>Quick Editor（不在本原型）</small></button><button role="menuitem" data-noop>新增比賽<small>賽事頁</small></button><button role="menuitem" data-noop>記錄回合<small>開啟賽事頁</small></button></div>`;
  if (S.device === "mobile" && S.sheet && S.sel) h += `<div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-label="詳細資訊"><div class="grab"></div>${detailHtml()}<button class="btn" data-act="close-sheet">關閉</button></div>`;
  if (S.Q === "Q2" && S.addSheet) {
    const inner = S.addSheet === "stock"
      ? `<h3>新增收藏</h3><div class="addrow"><input id="model" placeholder="輸入型號，例如 UX-01" autocomplete="off" aria-label="商品型號"></div><div class="actions"><button class="btn primary" data-act="add-stock">加入</button><button class="btn" data-act="close-add">取消</button></div>`
      : `<h3>新增額外零件</h3><div class="addrow"><select aria-label="類別">${TYPES.map(t => `<option>${t}</option>`).join("")}</select><input id="partName" placeholder="零件名稱"><input placeholder="數量" inputmode="numeric"></div><div class="actions"><button class="btn primary" data-act="add-part">加入</button><button class="btn" data-act="close-add">取消</button></div>`;
    h += `<div class="scrim" data-act="close-add"></div><div class="${S.device === "mobile" ? "sheet" : "dialog"}" role="dialog" aria-label="新增">${S.device === "mobile" ? '<div class="grab"></div>' : ""}${inner}<span class="hint">Q2（未採用）</span></div>`;
  }
  if (S.dialog) h += `<div class="scrim dlg-scrim"></div><div class="dialog" role="alertdialog" aria-label="確認"><p class="confirm-label">確認訊息（正式網站為原生 confirm）</p><pre class="confirm">${esc(S.dialog.text)}</pre><div class="actions"><button class="btn primary" data-act="dlg-ok">確定</button><button class="btn" data-act="dlg-cancel">取消</button></div></div>`;
  if (S.toast) h += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  return h;
}
function render() {
  renderOpts();
  const d = document.getElementById("device");
  const scrollTop = document.getElementById("scroller")?.scrollTop || 0;
  d.className = "device " + S.device;
  d.innerHTML = S.device === "desktop"
    ? sideHtml() + mainHtml() + `<aside class="detail" aria-label="詳細資訊">${detailHtml()}</aside>` + overlays()
    : mainHtml() + bnavHtml() + overlays();
  const sc = document.getElementById("scroller"); if (sc) sc.scrollTop = scrollTop;
  renderLegend();
}
function renderLegend() {
  const diff = Object.keys(FINAL).filter(k => S[k] !== FINAL[k]);
  document.getElementById("legend").innerHTML = `<div><b>${diff.length ? `目前顯示含未採用選項：${diff.map(k => S[k]).join("、")}` : "目前顯示：最終設計"}</b></div>
    <div>四個數字：原裝內含（原裝陀螺拆算，CX 上蓋不計）、額外持有（額外零件資料）、配置引用（配置使用此名稱的次數；CX 配置的組合上蓋不計）、可用＝原裝內含＋額外持有－配置引用。小於 0 顯示「超用」。只提示，不阻擋。</div>
    <div>名稱以完全相同比對，不處理全形／半形或大小寫。配置引用找不到持有名稱時，列在零件分頁底部「無對應引用」。</div>
    <div>搜尋、篩選、排序、分頁與清單／卡片切換只改變顯示層，正式網站的原始表格與資料順序不變，也不會寫入。</div>
    <div>示範資料：BX-00 兩顆為同一套組；「惡魔重錘 3-70 LF」引用不存在的軸心 LF（無對應引用）；騎士重盾為手動輸入（不能用英文名搜尋）。</div>`;
}

// ---------- D1 影響提示（文字會接在既有 confirm 訊息中） ----------
function listShort(list, verb) {
  if (!list.length) return "";
  const shown = list.slice(0, 5).map(o => `・${o.t} ${o.n}：持有 ${o.held}，配置引用 ${o.ref}（${o.configs.slice(0, 3).join("、")}${o.configs.length > 3 ? ` 等 ${o.configs.length} 個` : ""}）`);
  return `\n${verb}，下列零件會不夠配置使用：\n${shown.join("\n")}${list.length > 5 ? `\n…等 ${list.length} 個零件` : ""}`;
}
// 變更前就已不足的相關零件：不重複列入清單，另以一句提醒。
function alreadyShort(keys) {
  const before = shortages(holdings()).filter(o => keys.includes(key(o.t, o.n)));
  return before.map(o => `\n${o.t} ${o.n} 原本就不夠配置使用（持有 ${o.held}，配置引用 ${o.ref}），變更後會更不足。`).join("");
}
function listOrphan(list, oldName) {
  if (!list.length) return "";
  return `\n改名後，下列配置仍使用舊名稱「${oldName}」，將找不到對應零件：\n${list.map(o => `・${o.t} ${o.n}：${o.configs.slice(0, 3).join("、")}${o.configs.length > 3 ? ` 等 ${o.configs.length} 個` : ""}`).join("\n")}\n配置不會自動改名。`;
}
function askDeleteStock(id) {
  const b = COLLECTION.find(x => x.id === id);
  const ids = b.set ? COLLECTION.filter(x => x.set === b.set).map(x => x.id) : [id];
  const base = b.set ? `「${b.set}」是雙陀螺套組。確定要一起刪除「${COLLECTION.filter(x => ids.includes(x.id)).map(x => x.zh).join("、")}」嗎？` : `確定要刪除「${b.code} ${b.zh}」嗎？`;
  const keys = COLLECTION.filter(x => ids.includes(x.id)).flatMap(x => x.parts.map(([t, n]) => key(t, n)));
  const extra = listShort(newShortages(holdings({ excludeStock: ids })), b.set ? "整組刪除後" : "刪除後") + alreadyShort(keys);
  S.dialog = { text: base + extra + (extra ? "\n配置不會被修改。" : "") };
}
function askDeletePart(pid) {
  const p = EXTRA.find(x => x.id === pid);
  const extra = listShort(newShortages(holdings({ extraOverride: { id: pid, count: 0 } })), "刪除後") + alreadyShort([key(p.type, p.name)]);
  S.dialog = { text: `確定要刪除「${p.type}：${p.name}，數量 ${p.count}」嗎？` + extra + (extra ? "\n配置不會被修改。" : "") };
}
function askSaveEdit() {
  const p = EXTRA.find(x => x.id === S.edit.id);
  const o = { id: p.id, type: S.edit.type, name: S.edit.name.trim(), count: S.edit.count };
  if (o.type === p.type && o.name === p.name && o.count === p.count) { toast("沒有變更。"); return; }
  const h = holdings({ extraOverride: o });
  const renamed = o.type !== p.type || o.name !== p.name;
  const short = listShort(newShortages(h, { countVanished: !renamed }), renamed ? "變更後" : "數量減少後");
  const orphan = renamed ? listOrphan(newOrphans(h), p.name) : "";
  const oldKey = key(p.type, p.name);
  const prior = (o.count < p.count || renamed) && h.has(oldKey) ? alreadyShort([oldKey]) : "";
  S.dialog = { text: "確定要保存這次修改嗎？" + short + orphan + prior + ((short || prior) && !orphan ? "\n配置不會被修改。" : "") };
}

let toastTimer;
function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ""; render(); }, 2600); }
function focusLater(id) { setTimeout(() => document.getElementById(id)?.focus(), 30); }

// ---------- 事件 ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button, a, [data-act]");
  if (!t) return;
  if (t.matches("a")) e.preventDefault();
  if (t.dataset.opt) {
    const v = t.dataset.val; S[t.dataset.opt] = v === "true" ? true : v === "false" ? false : v;
    if (t.dataset.opt === "hist" && !S.hist) Object.assign(S, FINAL);
    S.sheet = false; S.qmenu = false; S.addSheet = null; S.edit = null; if (t.dataset.opt === "P") S.sel = null; render(); return;
  }
  if (t.dataset.view) { S.view = t.dataset.view; render(); return; }
  if (t.dataset.noop !== undefined) { S.qmenu = false; toast("原型只包含收藏與零件。"); return; }
  if (t.dataset.go) { S.tab = t.dataset.go; S.sel = null; S.edit = null; render(); return; }
  if (t.dataset.anchor) { document.getElementById(t.dataset.anchor)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (t.dataset.f) { S[t.dataset.f] = t.dataset.val; render(); return; }
  if (t.dataset.sel) { S.sel = { kind: t.dataset.sel, id: t.dataset.id }; S.edit = null; S.sheet = S.device === "mobile"; render(); return; }
  const act = t.dataset.act;
  if (!act) return;
  if (act === "qmenu") { S.qmenu = !S.qmenu; render(); setTimeout(() => document.querySelector(".qmenu button")?.focus(), 20); return; }
  if (act === "close-q") { S.qmenu = false; render(); return; }
  if (act === "q-stock" || act === "q-part") {
    S.qmenu = false; S.tab = act === "q-stock" ? "stock" : "part"; S.sel = null; S.sheet = false; S.edit = null;
    if (S.Q === "Q2") { S.addSheet = S.tab; render(); focusLater(S.tab === "stock" ? "model" : "partName"); }
    else { S.addOpen = true; render(); if (S.T === "T2") document.getElementById(S.tab === "stock" ? "secStock" : "secPart")?.scrollIntoView({ block: "start" }); focusLater(S.tab === "stock" ? "model" : "partName"); }
    return;
  }
  if (act === "close-add") { S.addSheet = null; render(); return; }
  if (act === "close-sheet") { S.sheet = false; S.edit = null; render(); return; }
  if (act === "add-stock") { S.addSheet = null; toast("原型：正式網站會呼叫既有 addRow()，再由 saveData() 儲存。"); return; }
  if (act === "add-part") { S.addSheet = null; toast("原型：正式網站會呼叫既有 addPart()，再由 saveData() 儲存。"); return; }
  if (act === "del-stock") { askDeleteStock(t.dataset.id); render(); return; }
  if (act === "del-part") { askDeletePart(t.dataset.id); render(); return; }
  if (act === "edit-part") { const p = EXTRA.find(x => x.id === t.dataset.id); S.edit = { id: p.id, type: p.type, name: p.name, count: p.count }; render(); focusLater("editName"); return; }
  if (act === "dec" || act === "inc") { S.edit.count = Math.max(1, S.edit.count + (act === "inc" ? 1 : -1)); render(); return; }
  if (act === "save-edit") { askSaveEdit(); render(); return; }
  if (act === "cancel-edit") { S.edit = null; toast("原型：正式網站會走既有 cancelEditRow（含確認）。"); return; }
  if (act === "dlg-cancel") { S.dialog = null; toast("已取消：沒有修改、沒有寫入。"); return; }
  if (act === "dlg-ok") { S.dialog = null; S.edit = null; toast("原型：不會修改假資料。正式網站會以原始列的按鈕呼叫既有函式。"); return; }
});
document.addEventListener("input", e => {
  const keep = (id, val) => { render(); const el = document.getElementById(id); el.focus(); el.setSelectionRange(val.length, val.length); };
  if (e.target.id === "stockSearch") { S.q = e.target.value; keep("stockSearch", S.q); }
  if (e.target.id === "partSearch") { S.pq = e.target.value; keep("partSearch", S.pq); }
  if (e.target.id === "model" && S.Q === "Q1") { S.addModel = e.target.value; S.addOpen = true; keep("model", S.addModel); }
  if (e.target.id === "editName" && S.edit) { S.edit.name = e.target.value; }
});
document.addEventListener("change", e => {
  if (e.target.matches("select[data-f]")) { S[e.target.dataset.f] = e.target.value; render(); }
  if (e.target.id === "editType" && S.edit) { S.edit.type = e.target.value; }
});
document.addEventListener("keydown", e => {
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && e.target.matches?.(".tab")) {
    S.tab = S.tab === "stock" ? "part" : "stock"; S.sel = null; render(); document.querySelector(".tab[aria-selected=true]")?.focus(); return;
  }
  if (e.key !== "Escape") return;
  if (S.dialog) S.dialog = null; else if (S.qmenu) S.qmenu = false; else if (S.edit) S.edit = null; else if (S.addSheet) S.addSheet = null; else if (S.sheet) S.sheet = false; else return;
  render();
});
document.addEventListener("toggle", e => { if (e.target.matches?.(".addpanel")) S.addOpen = e.target.open; }, true);

S.sel = { kind: "stock", id: "c5" };
if (window.matchMedia && window.matchMedia("(max-width: 700px)").matches && window.innerWidth > 0) { S.device = "mobile"; S.sel = null; }
render();
})();
</script>
