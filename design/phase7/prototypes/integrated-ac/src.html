<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>戰鬥陀螺管理器 A＋C 整合原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: prototype shell (top bar + options) around one or two app instances.
   Each app instance is a CSS container: at <= 760px it switches to the phone layout. */
:root{--shell-bg:#e9e6df;--shell-fg:#24211c;--shell-muted:#6d665a;--shell-line:#d3ccbf;--shell-panel:#f7f5f0;
  --display:"Space Grotesk","Noto Sans TC",system-ui,sans-serif;--body:"Noto Sans TC",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--shell-bg:#0b0e12;--shell-fg:#e4e9ef;--shell-muted:#8e99a6;--shell-line:#2a323d;--shell-panel:#141a21;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--shell-bg);color:var(--shell-fg);font:14px/1.55 var(--body);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #4f8cff;outline-offset:2px}
.shell-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 0;background:var(--shell-bg);border-bottom:1px solid var(--shell-line);margin-bottom:12px}
.shell-bar h1{font:700 15px/1.2 var(--display);margin:0;margin-right:auto}
.shell-bar .grp{display:flex;gap:4px;align-items:center}
.shell-bar .grp span{color:var(--shell-muted);font-size:12px;margin-right:2px}
.seg-s button{border:1px solid var(--shell-line);background:var(--shell-panel);border-radius:7px;padding:4px 10px;font-size:13px}
.seg-s button[aria-pressed="true"]{border-color:#4f8cff;box-shadow:inset 0 0 0 1px #4f8cff}
.stage{display:flex;gap:16px;align-items:flex-start;justify-content:center}
.stage .dev{display:grid;gap:6px;justify-items:center;min-width:0}
.stage .dev>small{color:var(--shell-muted)}
.dev-desktop{flex:1 1 0;width:100%;max-width:1280px;justify-items:stretch}
.dev-desktop .app{height:820px;width:100%}
.dev-phone{flex:0 0 auto}
.dev-phone .app{width:390px;max-width:calc(100vw - 24px);height:800px;border-radius:30px}
@media (max-width:1180px){.stage.compare{flex-direction:column;align-items:center}}
.notice{max-width:1280px;margin:0 auto 12px;color:var(--shell-muted);font-size:13px}
/* design options panel */
.opt-panel{position:fixed;right:12px;top:58px;z-index:60;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:var(--shell-panel);border:1px solid var(--shell-line);border-radius:12px;padding:14px;box-shadow:0 18px 40px #0004;display:grid;gap:12px}
.opt-panel[hidden]{display:none}
.opt-panel h2{font:700 15px var(--display);margin:0}
.opt-panel fieldset{border:1px solid var(--shell-line);border-radius:10px;padding:8px 10px;margin:0;display:grid;gap:6px}
.opt-panel legend{font-weight:700;font-size:13px;padding:0 4px}
.opt-panel label{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.opt-panel .st{font-size:11px;color:var(--shell-muted)}

/* ================= app ================= */
.app{--bg:#0f1318;--panel:#161c23;--panel2:#1d252e;--raise:#232c37;--line:#2a3440;--fg:#e7ecf2;--muted:#8d98a6;
  --accent:#4f8cff;--accent-fg:#fff;--ok:#3fb27f;--warn:#e0a23b;--bad:#e5534b;--bx:#4f8cff;--ux:#a371f7;--cx:#f0883e;
  --arena:#0a0d11;--arena-line:#2a2f37;--me:#3fd08a;--op:#ff6b5e;
  container:app/inline-size;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);border:1px solid var(--shell-line);border-radius:14px;display:grid;grid-template-rows:auto auto 1fr auto;font-size:13.5px}
.app[data-theme="beige"]{--bg:#f1eadf;--panel:#fbf7f0;--panel2:#f3ece1;--raise:#ebe2d3;--line:#ddd1bf;--fg:#2a251f;--muted:#776b5c;--accent:#2d68d4;
  --arena:#1c1a17;--arena-line:#3a352e;--ok:#23855a;--warn:#a96d0c;--bad:#c13b32}
.app *{min-width:0}
.app h2,.app h3,.app h4{font-family:var(--display);margin:0;text-wrap:balance}
.app h2{font-size:18px}.app h3{font-size:15px}.app h4{font-size:13.5px}
.muted{color:var(--muted)}.small{font-size:12px}.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;gap:10px}
/* top bar */
.topbar{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:8px;align-items:center;font:700 14px var(--display);white-space:nowrap;background:none;border:0;padding:0}
.brand i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--bx) 0 33%,var(--ux) 0 66%,var(--cx) 0);display:inline-block;box-shadow:inset 0 0 0 6px var(--panel)}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 12px}
.gresults{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 30px #0006;max-height:360px;overflow:auto;padding:6px}
.gresults h5{margin:6px 6px 2px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.gresults button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:6px 8px}
.gresults button:hover{background:var(--panel2)}
.syncpill{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.w{background:var(--warn)}.dot.b{background:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 12px;white-space:nowrap}
.btn:hover{background:var(--raise)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center}
/* banner */
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px}
.banner.w{background:color-mix(in srgb,var(--warn) 16%,var(--panel))}.banner.b{background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.banner:empty{display:none}
/* body */
.body{display:grid;grid-template-columns:200px 1fr;min-height:0}
.sidenav{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.sidenav small{color:var(--muted);font-size:11px;letter-spacing:.06em;padding:10px 10px 4px}
.sidenav button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--muted)}
.sidenav button[aria-current="page"]{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.sidenav button:hover{color:var(--fg)}
.sidenav svg{width:18px;height:18px;flex:none}
.sidenav .new{margin:4px 0 8px;justify-content:center;background:var(--accent);color:var(--accent-fg);font-weight:600}
.main{overflow:auto;padding:16px;display:grid;gap:14px;align-content:start;position:relative}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* cards / lists */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.kpi b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.tri{display:flex;gap:4px;margin-top:6px}.tri i{height:6px;border-radius:3px;display:block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.list{display:grid;gap:6px;align-content:start}
.item{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stripe{width:5px;align-self:stretch;border-radius:3px;background:var(--muted)}
.s-BX{background:var(--bx)}.s-UX{background:var(--ux)}.s-CX{background:var(--cx)}
.ttl{font-weight:600}.code{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.p{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line)}
.p.k{color:var(--muted)}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.w{color:var(--warn);border-color:var(--warn)}.tag.b{color:var(--bad);border-color:var(--bad)}.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.a{color:var(--accent);border-color:var(--accent)}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cards .item{grid-template-columns:5px minmax(0,1fr);align-items:start}
.detail{position:sticky;top:0;display:grid;gap:10px}
dl.kv{display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 10px;margin:0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meter div{background:var(--panel2);border-radius:8px;padding:6px 8px}
.meter b{display:block;font:700 18px var(--display);font-variant-numeric:tabular-nums}
.meter span{font-size:11px;color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.sectionh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{color:var(--muted);font-weight:500}
.tscroll{overflow-x:auto}
/* ===== C: arena ===== */
.arena{background:var(--arena);color:#eef2f6;border:1px solid var(--arena-line);border-radius:14px;padding:14px;display:grid;gap:12px}
.arena .muted{color:#9aa3ae}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}
.board .side small{display:block;color:#9aa3ae;font-size:12px}
.board .sc{font:700 54px/1 var(--display);font-variant-numeric:tabular-nums}
.board .me{color:var(--me)}.board .op{color:var(--op)}
.board .mid{display:grid;gap:4px;justify-items:center}
.pips{display:flex;gap:4px}.pips i{width:12px;height:12px;border-radius:3px;background:#2b313a;display:block}.pips i.on{background:currentColor}
.rp{display:grid;gap:8px}
.rp .lbl{font-size:12px;color:#9aa3ae}
.bigs{display:grid;gap:8px}
.bigs.two{grid-template-columns:1fr 1fr}.bigs.four{grid-template-columns:repeat(4,1fr)}.bigs.three{grid-template-columns:repeat(3,1fr)}
.bigs button{min-height:52px;border-radius:12px;border:1px solid #333a44;background:#151a20;color:#eef2f6;font-weight:600;padding:6px}
.bigs button small{display:block;font-weight:400;color:#9aa3ae;font-size:11.5px}
.bigs button[aria-pressed="true"]{border-color:#4f8cff;box-shadow:inset 0 0 0 2px #4f8cff;background:#18233a}
.bigs.res button[data-v="win"][aria-pressed="true"]{border-color:var(--me);box-shadow:inset 0 0 0 2px var(--me);background:#123022}
.bigs.res button[data-v="lose"][aria-pressed="true"]{border-color:var(--op);box-shadow:inset 0 0 0 2px var(--op);background:#331716}
.arena input{background:#151a20;border:1px solid #333a44;border-radius:10px;padding:10px;color:#eef2f6}
.arena .go{min-height:52px;border:0;border-radius:12px;background:#4f8cff;color:#fff;font-weight:700;font-size:15px}
.arena .go[disabled]{opacity:.45}
.tl{display:grid;gap:8px}
.match{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.match.cur{border-color:var(--accent)}
.mres{font:700 15px var(--display);font-variant-numeric:tabular-nums}
.win{color:var(--ok)}.lose{color:var(--bad)}
.tcard{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;width:100%}
.tcard[aria-current="true"]{border-color:var(--accent)}
.datebox{background:var(--panel2);border-radius:8px;text-align:center;padding:4px 0;font-variant-numeric:tabular-nums}
.datebox b{display:block;font:700 18px var(--display)}
/* stats */
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.src{font-size:12px;color:var(--muted)}
.warnline{font-size:12px;color:var(--warn)}
details.def summary{cursor:pointer;font-weight:600}
details.def dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:8px 0 0}
details.def dt{font-weight:600}
/* overlay */
.overlay{position:absolute;inset:0;z-index:40;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(620px,100%);max-height:100%;overflow:auto;padding:16px;display:grid;gap:12px;box-shadow:0 24px 50px #0007}
.dialog.wide{width:min(860px,100%)}
.dialog header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* assembler */
.structs{display:flex;gap:6px;flex-wrap:wrap}
.structs button{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 10px;text-align:left}
.structs button small{display:block;color:var(--muted);font-size:11px}
.structs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.asmgrid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px}
.slot{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center}
.slot label{font-size:12px;color:var(--muted)}
.slot select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.slot .fixed{border:1px dashed var(--warn);color:var(--warn);border-radius:8px;padding:7px 10px;font-size:12.5px}
.checks{display:grid;gap:4px;font-size:12.5px}
.c-ok{color:var(--ok)}.c-w{color:var(--warn)}.c-b{color:var(--bad)}.c-i{color:var(--muted)}
.stack{display:grid;gap:4px;justify-items:center;align-content:start;padding:8px;background:var(--panel2);border-radius:10px}
.stack span{height:22px;border-radius:11px;display:grid;place-items:center;font-size:11px;color:#fff;padding:0 8px;max-width:100%;overflow:hidden;white-space:nowrap}
.stack span.int{outline:2px dashed var(--warn);outline-offset:1px}
/* bottom nav (phone) */
.bnav{display:none}
.fab-menu{position:absolute;left:12px;right:12px;bottom:76px;z-index:35;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;display:grid;gap:4px;box-shadow:0 14px 30px #0007}
.fab-menu button{text-align:left;background:var(--panel2);border:0;border-radius:10px;padding:12px}
.sheet-close{display:none}
/* ===== phone layout (container query) ===== */
@container app (max-width:760px){
  .topbar{padding:10px 12px;gap:8px}
  .brand span{display:none}
  .gsearch{max-width:none}
  .syncpill b{display:none}
  .topnew{display:none}
  .body{grid-template-columns:1fr}
  .sidenav{display:none}
  .main{padding:12px;gap:12px;padding-bottom:20px}
  .kpis{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:1fr}
  .detail.desk{display:none}
  .cards{grid-template-columns:1fr}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding:6px 0 14px}
  .bnav button{display:grid;justify-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:10.5px;padding:2px 0;min-height:44px}
  .bnav button[aria-current="page"]{color:var(--fg)}
  .bnav .plus span{display:grid;place-items:center;width:44px;height:44px;margin-top:-20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 18px #0007}
  .overlay{align-items:flex-end;padding:0}
  .dialog{border-radius:18px 18px 0 0;width:100%;max-height:92%}
  .dialog.wide{width:100%}
  .sheet-close{display:inline-grid}
  .form2{grid-template-columns:1fr}
  .asmgrid{grid-template-columns:1fr}
  .stack{display:none}
  .board .sc{font-size:44px}
  .bigs.four{grid-template-columns:1fr 1fr}
  .tcard{grid-template-columns:44px minmax(0,1fr) auto}
  .hide-phone{display:none!important}
}
@container app (min-width:761px){.hide-desk{display:none!important}}
@media (prefers-reduced-motion:no-preference){.item,.tcard,.btn,.chip{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header class="shell-bar">
  <h1>A＋C 整合原型（假資料，不連 Firebase）</h1>
  <div class="grp seg-s" role="group" aria-label="檢視"><span>檢視</span>
    <button type="button" data-shell="view" data-v="compare">並排</button>
    <button type="button" data-shell="view" data-v="desktop">桌面</button>
    <button type="button" data-shell="view" data-v="phone">手機</button></div>
  <div class="grp seg-s" role="group" aria-label="主題"><span>主題</span>
    <button type="button" data-shell="theme" data-v="dark">深色</button>
    <button type="button" data-shell="theme" data-v="beige">米色</button></div>
  <div class="grp seg-s"><button type="button" data-shell="opts">設計選項（待決定）</button>
    <button type="button" data-shell="reset">重設資料</button></div>
</header>
<p class="notice">兩個裝置共用同一份假資料：在一邊新增或修改，另一邊立即反映。組裝規則直接內嵌正式網站的 <code>assembly-rules.js</code>（D-019），與正式行為一致。所有確認視窗都是頁內對話框。</p>
<div id="stage" class="stage"></div>
<aside id="optPanel" class="opt-panel" hidden></aside>

<script>
/* ===== Official assembly rules: injected verbatim from assembly-rules.js by build.mjs ===== */
const Rules = (() => {
/*@@ASSEMBLY_RULES@@*/

  <div class="split">
    <div class="grid">

        ${cm ? scoreboard(cm) : `<p class="muted">目前沒有進行中的對局。</p>`}

    </div>

      <section class="card grid"><h3>常用操作</h3>
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <button type="button" class="btn" data-act="addbey">新增收藏</button><button type="button" class="btn" data-act="addpart">新增零件</button>
          <button type="button" class="btn pri" data-act="newcfg">建立配置</button><button type="button" class="btn" data-act="newtour">新增比賽</button></div></section>
      <section class="card grid"><div class="sectionh"><h3>最近配置</h3><button type="button" class="btn sm" data-act="nav" data-v="configs">全部</button></div>
        <div class="list">${[...S.configs].sort((a, b) => b.created - a.created).slice(0, 4).map(c => cfgRow(c, inst, inv)).join("")}</div></section>
      <section class="card grid"><h3>同步</h3><div class="row"><span class="dot ${S.sync === "clean" ? "" : "w"}"></span><span>${S.sync === "clean" ? "已同步，沒有衝突或未儲存資料" : "需要處理，請查看頂部提示"}</span></div></section>
    </div>
  </div>`;
}

/* ---------- collection ---------- */
function beyStructure(b) { return b.asm === "UX_EXPAND" ? "固鎖一體" : b.asm === "CX_INTEGRATED" ? "軸心一體" : b.asm === "CX_4P" ? "CX 四件" : b.asm === "CX_3P" ? "CX 三件" : "標準"; }
function beyParts(b) {
  const parts = b.asm === "CX_4P" ? [["紋章鎖", b.lockChip], ["金屬戰刃", b.metalBlade], ["超越戰刃", b.overBlade], ["輔助戰刃", b.assistBlade]]
    : isCxAsm(b) ? [["紋章鎖", b.lockChip], ["主要戰刃", b.mainBlade], ["輔助戰刃", b.assistBlade]] : [["上蓋", b.blade]];
  parts.push(["固鎖", b.asm === "UX_EXPAND" ? "戰刃一體式" : b.ib ? "固鎖／軸心一體式" : b.ratchet], ["軸心", b.bit]);
  return parts.filter(([, v]) => v);
}
function pCollection(inst) {
  const { ui } = inst;
  return `<div class="sectionh"><h2>收藏</h2><div class="row"><button type="button" class="btn" data-act="addpart">＋ 零件</button><button type="button" class="btn pri" data-act="addbey">＋ 收藏</button></div></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-act="ctab" data-v="beys" aria-selected="${ui.ctab === "beys"}">原裝陀螺 ${S.collection.length}</button>
    <button type="button" role="tab" data-act="ctab" data-v="parts" aria-selected="${ui.ctab === "parts"}">零件 ${inventory().size}</button></div>
  ${ui.ctab === "beys" ? pBeys(inst) : pParts(inst)}`;
}
function pBeys(inst) {
  const { ui } = inst, f = ui.f;
  const q = ui.q.trim().toLowerCase();
  let list = S.collection.filter(b => (f.series === "all" || seriesOf(b.code) === f.series) && (f.struct === "all" || beyStructure(b) === f.struct)
    && (!q || [b.name, b.code, ...collectionPartList(b).map(x => x[1])].some(t => String(t).toLowerCase().includes(q))));
  const order = { UX: 0, BX: 1, CX: 2 };
  const sorts = { default: (a, b) => (order[seriesOf(a.code)] - order[seriesOf(b.code)]) || a.code.localeCompare(b.code, "zh-Hant", { numeric: true }),
    code: (a, b) => a.code.localeCompare(b.code, "zh-Hant", { numeric: true }), name: (a, b) => a.name.localeCompare(b.name, "zh-Hant"), recent: (a, b) => b.added - a.added };
  list.sort(sorts[f.sort] || sorts.default);
  const sel = S.collection.find(b => b.id === ui.sel.bey) || null;
  const chips = (k, vals) => vals.map(([v, l]) => `<button type="button" class="chip" data-act="filter" data-k="${k}" data-v="${v}" aria-pressed="${f[k] === v}">${l}</button>`).join("");
  return `<div class="toolbar"><input type="search" placeholder="搜尋型號、名稱或零件" aria-label="搜尋收藏" data-fk="cq" data-in="q" value="${esc(ui.q)}">
    <select aria-label="排序" data-sel="sort">${[["default","預設（UX→BX→CX）"],["code","型號"],["name","名稱"],["recent","最近加入"]].map(([v, l]) => `<option value="${v}" ${f.sort === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    <div class="row">${chips("view", [["cards","卡片"],["list","清單"]])}</div></div>
  <div class="toolbar">${chips("series", [["all","全部"],["BX","BX"],["UX","UX"],["CX","CX"]])}<span class="muted small">｜</span>${chips("struct", [["all","所有結構"],["標準","標準"],["CX 三件","CX 三件"],["CX 四件","CX 四件"],["固鎖一體","固鎖一體"],["軸心一體","軸心一體"]])}</div>
  <div class="split"><div class="${f.view === "cards" ? "cards" : "list"}">${list.map(b => `<button type="button" class="item" data-act="selbey" data-id="${b.id}" aria-current="${sel?.id === b.id}">
      <span class="stripe s-${seriesOf(b.code)}"></span><span><span class="ttl">${esc(b.name)}</span> <span class="code">${esc(b.code)}</span>
      <span class="pills">${beyParts(b).map(([t, v]) => `<span class="p">${f.view === "list" ? "" : `<span class="k">${t} </span>`}${esc(v)}</span>`).join("")}</span></span>
      ${f.view === "list" ? `<span class="tags">${b.setInst ? '<span class="tag">套組</span>' : ""}<span class="tag">${b.auto ? "自動帶入" : "手動"}</span></span>` : ""}</button>`).join("") || '<div class="empty">沒有符合的原裝陀螺</div>'}</div>
    <aside class="detail desk">${sel ? beyDetail(sel) : '<div class="empty">選擇一顆陀螺查看詳細資料</div>'}</aside></div>`;
}
function beyDetail(b) {
  return `<section class="card grid"><div class="sectionh"><h3>${esc(b.name)}</h3><button type="button" class="iconbtn sheet-close" data-act="closesheet" aria-label="關閉">${icon("close")}</button></div>
    <div class="row"><span class="tag">${esc(b.code)}</span><span class="tag">${beyStructure(b)}</span><span class="tag">${b.auto ? "型錄自動帶入" : "手動輸入"}</span>${b.setInst ? '<span class="tag">套組</span>' : ""}</div>
    <dl class="kv">${beyParts(b).map(([t, v]) => `<dt>${t}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <p class="muted small" style="margin:0">零件顯示順序依 D-004。${b.auto ? "型錄升級只套用在明確標記為自動帶入的資料（D-015）。" : "手動資料不會被型錄自動覆寫（D-015）。"}</p>
    <div class="row"><button type="button" class="btn sm" data-act="cfgfrombey" data-id="${b.id}">用這顆建立配置</button><button type="button" class="btn sm danger" data-act="delbey" data-id="${b.id}">刪除</button></div></section>`;
}
function pParts(inst) {
  const { ui } = inst, f = ui.f;
  const q = ui.q.trim().toLowerCase();
  const inv = inventory();
  let list = [...inv.values()].filter(e => (f.ptype === "all" || (f.ptype === "CX" ? CX_TYPES.includes(e.type) : e.type === f.ptype))
    && (!f.availOnly || e.avail > 0) && (!q || `${e.type} ${e.name}`.toLowerCase().includes(q)));
  const sorts = { default: (a, b) => PART_TYPES.indexOf(a.type) - PART_TYPES.indexOf(b.type) || a.name.localeCompare(b.name, "zh-Hant", { numeric: true }),
    avail: (a, b) => b.avail - a.avail, name: (a, b) => a.name.localeCompare(b.name, "zh-Hant", { numeric: true }), used: (a, b) => b.used - a.used };
  list.sort(sorts[f.psort || "default"]);
  const all = [...inv.values()];
  const owned = all.reduce((a, e) => a + e.owned, 0), used = all.reduce((a, e) => a + Math.min(e.owned, e.used), 0);
  const sel = inv.get(ui.sel.part) || null;
  const chips = [["all","全部"],["上蓋","上蓋"],["固鎖","固鎖"],["軸心","軸心"],["CX","CX 分件"]].map(([v, l]) => `<button type="button" class="chip" data-act="filter" data-k="ptype" data-v="${v}" aria-pressed="${f.ptype === v}">${l}</button>`).join("");
  return `<div class="kpis"><div class="kpi"><b>${inv.size}</b><span>零件種類</span></div><div class="kpi"><b>${owned}</b><span>持有總數（原裝＋額外）</span></div>
    <div class="kpi"><b>${used}</b><span>配置引用（使用中）</span></div><div class="kpi"><b>${owned - used}</b><span>可用</span></div></div>
  <div class="toolbar"><input type="search" placeholder="搜尋零件" aria-label="搜尋零件" data-fk="pq" data-in="q" value="${esc(ui.q)}">
    <select aria-label="排序" data-sel="psort">${[["default","類別"],["name","名稱"],["avail","可用量"],["used","引用量"]].map(([v, l]) => `<option value="${v}" ${(f.psort || "default") === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    <button type="button" class="chip" data-act="filter" data-k="availOnly" data-v="toggle" aria-pressed="${f.availOnly}">只看可用</button></div>
  <div class="toolbar">${chips}</div>
  <div class="split"><div class="list">${list.map(e => `<button type="button" class="item" data-act="selpart" data-id="${esc(key(e.type, e.name))}" aria-current="${sel === e}">
      <span class="stripe" style="background:${CX_TYPES.includes(e.type) ? "var(--cx)" : e.type === "上蓋" ? "var(--ux)" : "var(--bx)"}"></span>
      <span><span class="code">${esc(e.type)}</span> <span class="ttl">${esc(e.name)}</span></span>
      <span class="tags"><span class="tag">持有 ${e.owned}</span><span class="tag a">引用 ${e.used}</span><span class="tag ${e.avail > 0 ? "ok" : e.avail < 0 ? "b" : "w"}">可用 ${e.avail}</span></span></button>`).join("") || '<div class="empty">沒有符合的零件</div>'}</div>
    <aside class="detail desk">${sel ? partDetail(sel) : '<div class="empty">選擇零件查看持有、引用與出賽紀錄</div>'}</aside></div>`;
}
function partDetail(e) {
  return `<section class="card grid"><div class="sectionh"><h3>${esc(e.type)}｜${esc(e.name)}</h3><button type="button" class="iconbtn sheet-close" data-act="closesheet" aria-label="關閉">${icon("close")}</button></div>
    <div class="meter"><div><b>${e.owned}</b><span>持有</span></div><div><b>${e.used}</b><span>配置引用</span></div><div><b style="color:${e.avail < 0 ? "var(--bad)" : "inherit"}">${e.avail}</b><span>可用</span></div></div>
    <dl class="kv"><dt>持有來源</dt><dd>${e.fromBeys.map(b => `${esc(b.name)}（原裝）`).join("、") || "—"}${e.extra ? `${e.fromBeys.length ? "、" : ""}額外零件 ×${e.extra}` : ""}</dd>
      <dt>配置引用</dt><dd>${e.refs.map(c => esc(configLabel(c))).join("、") || "沒有配置使用"}</dd>
      <dt>出賽使用</dt><dd>${e.rounds} 回合<div class="muted small">依賽事回合紀錄的陀螺文字比對配置；配置改名或修改後的舊回合、自填陀螺不會計入。</div></dd></dl>
    ${e.extra ? `<div class="row"><button type="button" class="btn sm" data-act="editpart" data-id="${e.extraId}">修改額外數量</button><button type="button" class="btn sm danger" data-act="delpart" data-id="${e.extraId}">刪除額外零件</button></div>` : '<p class="muted small" style="margin:0">這個零件只來自原裝陀螺；要減少請刪除對應的收藏。</p>'}

}

/* ---------- configs ---------- */

  return `<button type="button" class="item" data-act="selcfg" data-id="${c.id}" aria-current="${inst.ui.sel.cfg === c.id}"><span class="stripe s-${s}"></span>
    <span><span class="ttl">${esc(configLabel(c))}</span><span class="pills"><span class="p k">${structLabel(c.kind)}</span>${c.fix === "-" ? '<span class="p k">無固鎖（一體式）</span>' : ""}</span></span>
    <span class="tags">${v.length ? '<span class="tag w">規則</span>' : ""}${over.length ? '<span class="tag b">庫存</span>' : ""}</span></button>`;
}
function pConfigs(inst) {
  const { ui } = inst, f = ui.f, inv = inventory();
  const q = f.cq.trim().toLowerCase();
  const list = S.configs.filter(c => (f.cstruct === "all" || c.kind === f.cstruct) && (!q || configLabel(c).toLowerCase().includes(q) || configPartList(c).some(([, n]) => n.toLowerCase().includes(q))));

    <button type="button" role="tab" data-act="contab" data-v="history" aria-selected="${ui.conTab === "history"}">拆解紀錄 ${S.history.length}</button></div>
  ${ui.conTab === "history" ? pHistory() : `<div class="toolbar"><input type="search" placeholder="搜尋配置或零件（例如 1-60）" aria-label="搜尋配置" data-fk="cfq" data-in="cq" value="${esc(f.cq)}">
    ${[["all","全部"],["std","標準三件式"],["cx3","CX 三件"],["cx4","CX 四件"]].map(([v, l]) => `<button type="button" class="chip" data-act="filter" data-k="cstruct" data-v="${v}" aria-pressed="${f.cstruct === v}">${l}</button>`).join("")}</div>
  <div class="split"><div class="list">${list.map(c => cfgRow(c, inst, inv)).join("") || '<div class="empty">沒有符合的配置</div>'}</div>
    <aside class="detail desk">${sel ? cfgDetail(sel, inv) : '<div class="empty">選擇配置查看零件、規則與庫存</div>'}</aside></div>`}`;
}
function cfgDetail(c, inv) {
  const v = evalCfg(c).violations, over = partsOverused(c, inv);
  return `<section class="card grid"><div class="sectionh"><h3>${esc(configLabel(c))}</h3><button type="button" class="iconbtn sheet-close" data-act="closesheet" aria-label="關閉">${icon("close")}</button></div>
    <div class="row"><span class="tag">${structLabel(c.kind)}</span><span class="tag">內部型號 ${esc(configModel(c))}</span></div>
    <dl class="kv">${configPartList(c).map(([t, n]) => { const e = inv.get(key(t, n)); return `<dt>${t}</dt><dd>${esc(n)} <span class="muted small">持有 ${e?.owned ?? 0}｜引用 ${e?.used ?? 0}</span></dd>`; }).join("")}${c.fix === "-" ? `<dt>固鎖</dt><dd>無（${Rules.isIntegratedRatchetBit(c.axis) ? "與軸心一體" : "戰刃內建"}）</dd>` : ""}</dl>
    ${v.length ? `<div class="checks">${v.map(x => `<span class="c-w">！ ${esc(x.message)}</span>`).join("")}<span class="c-i">舊資料只警告，仍可開啟與原樣儲存（D-019）。</span></div>` : '<div class="checks"><span class="c-ok">✓ 符合官方組裝規則</span></div>'}
    ${over.length ? `<div class="checks"><span class="c-b">✕ ${esc(over.map(x => x[1]).join("、"))} 的配置引用超過持有量</span></div>` : ""}

function pHistory() {
  return `<div class="list">${S.history.map(h => `<div class="item"><span class="stripe" style="background:${/不好/.test(h.result) ? "var(--bad)" : /好用/.test(h.result) ? "var(--ok)" : "var(--muted)"}"></span>

    <span class="row"><button type="button" class="btn sm" data-act="restore" data-id="${h.id}">還原為配置</button><button type="button" class="btn sm danger" data-act="delhist" data-id="${h.id}">刪除</button></span></div>`).join("") || '<div class="empty">還沒有拆解紀錄</div>'}</div>

/* ---------- tournaments (C) ---------- */
function scoreboard(mt) {
  const { me, op } = matchScore(mt);
  const pips = (n, cls) => `<span class="pips ${cls}">${[0, 1, 2, 3].map(i => `<i class="${i < Math.min(n, 4) ? "on" : ""}"></i>`).join("")}</span>`;
  return `<div class="board" role="group" aria-label="比分"><div class="side"><small>我方</small><div class="sc me">${me}</div>${pips(me, "me")}</div>
    <div class="mid"><small class="muted">對手 ${esc(mt.opponent)}</small><b>第 ${mt.rounds.length + 1} 回合</b><small class="muted">先到 4 分</small></div>
    <div class="side"><small>對手</small><div class="sc op">${op}</div>${pips(op, "op")}</div></div>`;
}
function roundPanel(inst, t, mt) {
  const rp = inst.ui.rp && inst.ui.rp.m === mt.id ? inst.ui.rp : (inst.ui.rp = { m: mt.id, bey: 0, res: "win", type: "over", note: "" });
  const pt = SCORE_TYPES[rp.type].point, { me, op } = matchScore(mt);
  const nm = me + (rp.res === "win" ? pt : 0), no = op + (rp.res === "lose" ? pt : 0);
  const out = nm >= 4 ? "這回合後：本局勝利" : no >= 4 ? "這回合後：本局落敗" : "這回合後：仍在進行";
  return `<div class="rp"><span class="lbl">本回合陀螺（本場三顆）</span>
    <div class="bigs three">${mt.deck.map((d, i) => `<button type="button" data-act="rp" data-k="bey" data-v="${i}" aria-pressed="${rp.bey === i}">${esc(d)}</button>`).join("")}</div>

function remainingFor(e, d) {

      <div class="stack" aria-hidden="true"><span style="background:transparent;color:var(--muted)">組合預覽（上→下）</span>${layers.map(([t, v]) => `<span style="width:${{ 紋章鎖: 70, 超越戰刃: 170, 金屬戰刃: 150, 主要戰刃: 150, 上蓋: 150, 輔助戰刃: 130, 固鎖: 110, 軸心: 56 }[t]}px;background:${v ? colors[t] : "transparent"};${v ? "" : "border:1px dashed var(--line);color:var(--muted)"}" class="${(st.intBlade && t === "上蓋") || (st.intBit && t === "軸心") ? "int" : ""}">${esc(v || t)}</span>`).join("")}</div></div>

}
function asmChecks(d, st, inv) {
  const out = [];
  const req = d.kind === "std" ? [["layer", "上蓋"], ["axis", "軸心"]] : d.kind === "cx3" ? [["lock", "紋章鎖"], ["main", "主要戰刃"], ["assist", "輔助戰刃"], ["axis", "軸心"]] : [["lock", "紋章鎖"], ["over", "超越戰刃"], ["metal", "金屬戰刃"], ["assist", "輔助戰刃"], ["axis", "軸心"]];
  if (!(st.intBlade || st.intBit)) req.splice(req.length - 1, 0, ["fix", "固鎖"]);
  const missing = req.filter(([k]) => !d[k]).map(([, l]) => l);
  if (missing.length) out.push(["i", `尚未選擇：${missing.join("、")}`]);
  // An empty ratchet on 時鐘幻象 is reported as "not chosen yet", not as a rule error.
  st.ev.violations.filter(v => !(v.id === "simple-ratchet-only" && !d.fix && !st.intBit)).forEach(v => out.push(["b", `${v.message}（官方規則，不能儲存）`]));
  if (d.kind === "cx4") out.push(["ok", "CX 四件需要金屬戰刃與超越戰刃（官方：缺金屬戰刃不可使用）"]);
  if (d.kind === "cx4" && d.axis && Rules.isIntegratedRatchetBit(d.axis)) out.push(["w", "Tr／Op 裝在 CX 四件戰刃下：官方未說明，僅提示"]);
  const c = { ...draftToCfg(d), fix: st.fix };
  configPartList(c).forEach(([t, n]) => { const e = inv.get(key(t, n)); if (e && remainingFor(e, d) <= 0) out.push(["b", `${t} ${n} 已經沒有庫存（被 ${e.refs.filter(r => r.id !== d.editId).map(configLabel).join("、")} 使用）`]); });
  const label = configLabel(c);
  if (!missing.length && S.history.some(h => h.label === label)) out.push(["w", "這個組合以前拆解過，可在「拆解紀錄」查看原因"]);
  if (!missing.length && !st.ev.violations.length && !out.some(x => x[0] === "b")) out.push(["ok", "符合官方組裝規則，庫存足夠"]);
  return out;
}
function saveCfg(inst) {
  const d = inst.ui.overlay.d, st = asmState(d), inv = inventory();
  const checks = asmChecks(d, st, inv);
  if (checks.some(([c, t]) => c === "i")) return info(inst, "還不能儲存", checks.find(([c]) => c === "i")[1]);
  const c = { ...draftToCfg(d), fix: st.fix };
  const stock = checks.find(([cl, t]) => cl === "b" && /沒有庫存/.test(t));
  if (stock) return info(inst, "還不能儲存", stock[1]);
  const after = Rules.evaluateAssembly(ruleInput(c));
  const commit = () => {
    if (d.editId) Object.assign(S.configs.find(x => x.id === d.editId), c, { legacy: false });
    else S.configs.push({ ...cfg(c.kind, c), fix: c.fix });
    inst.ui.overlay = null; inst.ui.sel.cfg = d.editId || S.configs.at(-1).id; renderAll();
  };
  if (!after.violations.length) return commit();
  if (!d.editId) return info(inst, "不能儲存", after.violations[0].message);
  const before = Rules.evaluateAssembly(ruleInput(S.configs.find(x => x.id === d.editId)));
  const added = Rules.newAssemblyViolations(before, after);
  if (added.length) return info(inst, "不能儲存", added[0].message);
  ask(inst, "這個配置原本就不符合官方組裝規則", `${after.violations.map(v => v.message).join("\n")}\n\n仍要儲存這次修改嗎？`, "仍要儲存", commit);
}
function openAsm(inst, base, opts = {}) {
  const d = base ? { kind: base.kind, layer: base.layer, lock: base.lock, main: base.main, over: base.over, metal: base.metal, assist: base.assist, fix: base.fix === "-" ? "" : base.fix, axis: base.axis, editId: opts.edit ? base.id : null }
    : { kind: "std", layer: "", lock: "", main: "", over: "", metal: "", assist: "", fix: "", axis: "", editId: null };
  if (opts.edit && base.fix === "-") d.fix = "";

}

function deckDupHint(deck) {
  if (SHELL.opts.tour3 !== "on") return "";
  const byLabel = new Map(S.configs.map(c => [configLabel(c), c]));
  const seen = new Map(), dups = new Set();
  // Official B4 regulation: no repeated parts across the three beys; lock chips may repeat,
  // except ワルキューレ and エンペラー (catalog names 戰神, 帝王; mapping confirmed by the user 2026-11-23), one each.
  const LIMITED_LOCK_CHIPS = ["戰神", "帝王"];
  deck.forEach(txt => { const c = byLabel.get(txt); if (!c) return; configPartList(c).forEach(([t, n]) => {
    if (t === "紋章鎖" && !LIMITED_LOCK_CHIPS.includes(n)) return;
    const k = key(t, n); if (seen.has(k) && seen.get(k) !== txt) dups.add(`${t} ${n}`); seen.set(k, txt); }); });
  return `<p class="${dups.size ? "c-w" : "c-ok"} small" style="margin:0">${dups.size ? `！3on3 提示：三顆之間有重複零件 ${[...dups].join("、")}` : "✓ 3on3 提示：三顆之間沒有重複零件"} <span class="tag">官方規則・只提示不阻擋</span></p>`;
}

/* ================= interactions ================= */
function ask(inst, title, text, ok, fn, danger = false) { inst.ui.overlay = { type: "confirm", title, text, ok, fn, danger }; renderAll(); }
function info(inst, title, text) { inst.ui.overlay = { type: "info", title, text }; renderAll(); }
const isPhone = inst => inst.app.clientWidth <= 760;
function wire(inst) {
  const { app, ui } = inst;
  app.addEventListener("click", e => {
    if (e.target.classList.contains("overlay")) { ui.overlay = null; return renderAll(); }
    const el = e.target.closest("[data-act]"); if (!el || !app.contains(el)) { if (ui.gq && !e.target.closest(".gsearch")) { ui.gq = ""; render(inst); } return; }
    act(inst, el.dataset.act, el);
  });
  app.addEventListener("input", e => {
    const k = e.target.dataset.in; if (!k) return;
    if (k.startsWith("ov:")) { ui.overlay[k.slice(3)] = e.target.value; }
    else if (k === "ovcode") ui.overlay.code = e.target.value;
    else if (k === "rpnote") { ui.rp.note = e.target.value; return; }
    else if (k === "cq") ui.f.cq = e.target.value;
    else ui[k] = e.target.value;
    renderAll();
  });
  app.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.sel) { ui.f[t.dataset.sel] = t.value; return renderAll(); }
    if (t.dataset.asm) { const d = ui.overlay.d; d[t.dataset.asm] = t.value; return renderAll(); }
    if (t.dataset.ov) { const o = ui.overlay; const k = t.dataset.ov; if (k.startsWith("deck")) o.deck[+k.slice(4)] = t.value; else o[k] = t.value; return renderAll(); }
  });
  app.addEventListener("keydown", e => { if (e.key === "Escape" && (ui.overlay || ui.fab || ui.gq)) { ui.overlay = null; ui.fab = false; ui.gq = ""; renderAll(); } });
}
function act(inst, a, el) {
  const { ui } = inst, v = el.dataset.v, id = el.dataset.id;
  const t = S.tournaments.find(x => x.id === (el.dataset.t || id));
  const go = r => { ui.route = r; ui.fab = false; ui.gq = ""; ui._resetScroll = true; };
  switch (a) {
    case "nav": go(v); if (v === "tournaments") ui.tsel = null; break;
    case "goto": go(el.dataset.r);
      if (el.dataset.r === "collection") { ui.ctab = el.dataset.t; if (el.dataset.t === "beys") ui.sel.bey = id; else ui.sel.part = id; if (isPhone(inst)) ui.overlay = { type: "detail", kind: el.dataset.t === "beys" ? "bey" : "part", id }; }

    case "selpart": ui.sel.part = id; if (isPhone(inst)) ui.overlay = { type: "detail", kind: "part", id }; break;
    case "selcfg": ui.sel.cfg = id; if (isPhone(inst)) ui.overlay = { type: "detail", kind: "cfg", id }; break;
    case "closesheet": case "close": ui.overlay = null; break;
    case "confirmok": { const fn = ui.overlay.fn; ui.overlay = null; fn(); return; }
    case "theme": SHELL.theme = v; break;
    case "sync": S.sync = v; break;
    case "signin": S.signedIn = !S.signedIn; break;
    case "help": info(inst, v, `「${v}」頁面內容沿用現有說明頁，這裡只示範入口位置。`); return;
    /* configs */
    case "newcfg": openAsm(inst, null); go(ui.route); break;
    case "editcfg": openAsm(inst, S.configs.find(c => c.id === id), { edit: true }); break;
    case "dupcfg": openAsm(inst, S.configs.find(c => c.id === id), { dup: true }); break;
    case "cfgfrombey": { const b = S.collection.find(x => x.id === id);
      const base = b.asm === "CX_4P" ? { kind: "cx4", lock: b.lockChip, over: b.overBlade, metal: b.metalBlade, assist: b.assistBlade, fix: b.ratchet, axis: b.bit }

      openAsm(inst, { layer: "", lock: "", main: "", over: "", metal: "", assist: "", ...base }, { dup: true }); break; }
    case "asmkind": Object.assign(ui.overlay.d, { kind: v, layer: "", lock: "", main: "", over: "", metal: "", assist: "", fix: "", axis: "" }); break;
    case "savecfg": saveCfg(inst); return;
    case "delcfg": ui.overlay = { type: "delcfg", id, reason: "", note: "" }; break;
    case "dodelcfg": { const o = ui.overlay, c = S.configs.find(x => x.id === o.id);
      if (o.reason !== "打錯，不記錄") S.history.unshift({ id: uid("h"), label: configLabel(c), result: o.reason, note: o.note || "", date: new Date().toLocaleDateString("zh-TW"), cfg: { ...c } });

        const short = configPartList(c).filter(([tt, n]) => (inv.get(key(tt, n))?.avail ?? 0) <= 0);
        if (short.length) return info(inst, "無法還原", `${short.map(x => x.join(" ")).join("、")} 已經沒有庫存。`);
        S.configs.push(c); renderAll(); }); return; }
    case "delhist": ask(inst, "刪除拆解紀錄", "確定要刪除這筆拆解紀錄嗎？", "刪除", () => { S.history = S.history.filter(h => h.id !== id); renderAll(); }, true); return;
    /* collection */
    case "addbey": ui.fab = false; ui.overlay = { type: "addbey", mode: "auto", code: "" }; break;
    case "beymode": ui.overlay.mode = v; break;
    case "addcat": case "addcatall": {
      const norm = c => c.toUpperCase().replace(/[^A-Z0-9]/g, "");
      const code = ui.overlay.code; const all = CATALOG.filter(r => norm(r.code) === norm(code) || norm(r.id) === norm(code));
      const pick = a === "addcat" ? all.filter(r => r.id === v) : all;
      const setInst = pick.length > 1 && pick.every(p => p.set && p.set === pick[0].set) ? uid("set") : null;
      pick.forEach(r => S.collection.push({ ...fromCatalog(r, true, setInst), added: Date.now() }));
      ui.overlay = null; ui.route = "collection"; ui.ctab = "beys"; ui.sel.bey = S.collection.at(-1).id; break; }
    case "addmanual": { const o = ui.overlay;
      if (!o.mcode || !o.mblade || !o.mbit) return info(inst, "還不能加入", "請輸入型號、上蓋與軸心。");
      const fix = Rules.evaluateAssembly({ model: o.mcode, layer: o.mblade, axis: o.mbit }).noRatchet && !o.mfix ? "-" : (o.mfix || "");
      const ev = Rules.evaluateAssembly({ model: o.mcode, layer: o.mblade, fix, axis: o.mbit });
      if (ev.violations.length) return info(inst, "不能加入", ev.violations[0].message);
      if (!fix) return info(inst, "還不能加入", "請輸入固鎖。");
      S.collection.push({ id: uid("b"), recordId: "", code: o.mcode.toUpperCase(), name: o.mblade, asm: Rules.isIntegratedRatchetBlade(o.mblade, o.mcode) ? "UX_EXPAND" : "STANDARD", auto: false, setInst: null,
        blade: o.mblade, lockChip: "", mainBlade: "", overBlade: "", metalBlade: "", assistBlade: "", ratchet: fix === "-" ? "" : fix, bit: o.mbit, ib: "", added: Date.now() });
      ui.overlay = null; ui.route = "collection"; ui.ctab = "beys"; ui.sel.bey = S.collection.at(-1).id; break; }
    case "delbey": { const b = S.collection.find(x => x.id === id);
      const group = b.setInst ? S.collection.filter(x => x.setInst === b.setInst) : [b];
      const inv = inventory();
      const affected = S.configs.filter(c => configPartList(c).some(([tt, n]) => { const e = inv.get(key(tt, n)); return e && e.fromBeys.some(x => group.includes(x)) && e.owned - 1 < e.used; }));
      ask(inst, "刪除收藏", `${group.length > 1 ? `「${b.code}」是套組，會一起刪除：${group.map(x => x.name).join("、")}。` : `確定要刪除「${b.code} ${b.name}」嗎？`}${affected.length ? `\n\n刪除後這些配置的零件會超過持有量：\n${affected.map(configLabel).join("\n")}` : ""}`, "刪除", () => {
        S.collection = S.collection.filter(x => !group.includes(x)); ui.sel.bey = null; renderAll(); }, true); return; }
    case "addpart": ui.fab = false; ui.overlay = { type: "part", ptype: "固鎖", name: "", count: "1" }; break;
    case "editpart": { const p = S.parts.find(x => x.id === id); ui.overlay = { type: "part", id, ptype: p.type, name: p.name, count: String(p.count) }; break; }
    case "savepart": { const o = ui.overlay, n = Number(o.count);
      if (!o.name.trim()) return info(inst, "還不能保存", "請輸入零件名稱。");
      if (!Number.isInteger(n) || n <= 0) return info(inst, "還不能保存", "數量必須是大於 0 的整數。");
      const doit = () => { if (o.id) Object.assign(S.parts.find(x => x.id === o.id), { type: o.ptype, name: o.name.trim(), count: n }); else S.parts.push({ id: uid("p"), type: o.ptype, name: o.name.trim(), count: n });
        ui.overlay = null; ui.route = "collection"; ui.ctab = "parts"; ui.sel.part = key(o.ptype, o.name.trim()); renderAll(); };
      if (o.id) return ask(inst, "保存修改", "確定要保存這次修改嗎？", "保存", doit); doit(); return; }
    case "delpart": { const p = S.parts.find(x => x.id === id), e = inventory().get(key(p.type, p.name));
      const after = e.owned - p.count, over = e.used - after;
      ask(inst, "刪除額外零件", `類別：${p.type}，名稱：${p.name}，數量 ${p.count}${over > 0 ? `\n\n刪除後持有 ${after}，但有 ${e.used} 個配置引用，會超過持有量：\n${e.refs.map(configLabel).join("\n")}` : ""}`, "刪除", () => {
        S.parts = S.parts.filter(x => x !== p); ui.sel.part = null; renderAll(); }, true); return; }
    /* tournaments */
    case "seltour": ui.tsel = id || null; ui.rp = null; ui._resetScroll = true; break;
    case "newtour": go("tournaments"); ui.overlay = { type: "tour", date: "2026-12-07", name: "", location: "", count: "8", note: "" }; break;
    case "edittour": ui.overlay = { type: "tour", id: t.id, date: t.date, name: t.name, location: t.location, count: String(t.count), note: t.note, finished: t.finished }; break;
    case "savetour": { const o = ui.overlay, n = Number(o.count);
      if (!o.date || !o.name.trim() || !(n >= 2)) return info(inst, "還不能保存", "請填寫日期、比賽名稱，人數至少 2。");
      if (o.id) Object.assign(S.tournaments.find(x => x.id === o.id), { date: o.date, name: o.name.trim(), location: o.location, count: n, note: o.note, finished: false });
      else { const nt = { id: uid("t"), date: o.date, name: o.name.trim(), location: o.location, count: n, note: o.note, finished: false, matches: [] }; S.tournaments.push(nt); ui.tsel = nt.id; }
      ui.overlay = null; break; }
    case "finishtour": ask(inst, "完成比賽", `目前名次：${standing(t)}${currentMatch(t) ? "\n\n還有進行中的對局，名次可能不是最終結果。" : ""}\n\n完成後對局與回合會鎖定。`, "完成", () => { t.finished = true; renderAll(); }); return;
    case "deltour": ask(inst, "刪除比賽", `確定要刪除「${t.name}」嗎？`, "刪除", () => { S.tournaments = S.tournaments.filter(x => x !== t); ui.tsel = null; renderAll(); }, true); return;
    case "advance": ask(inst, v === "bye" ? "輪空／種子" : "對手未到", `${v === "bye" ? "輪空／種子，直接晉級" : "對手棄權／未到，直接晉級"}？`, "確定", () => {
      t.matches.push({ id: uid("m"), opponent: v === "bye" ? "輪空" : "對手未到", adv: v, deck: [], rounds: [] }); renderAll(); }); return;
    case "addmatch": ui.overlay = { type: "match", tid: t.id, opponent: "", deck: ["", "", ""] }; break;
    case "editmatch": { const m = t.matches.find(x => x.id === el.dataset.m); ui.overlay = { type: "match", tid: t.id, mid: m.id, opponent: m.opponent, deck: [...m.deck] }; break; }
    case "savematch": { const o = ui.overlay, tt = S.tournaments.find(x => x.id === o.tid);
      const deck = [0, 1, 2].map(i => (o["custom" + i] || "").trim() || o.deck[i]);
      if (!o.opponent.trim() || deck.some(x => !x)) return info(inst, "還不能儲存", "請填寫對手名稱與三顆使用陀螺。");
      if (o.mid) Object.assign(tt.matches.find(x => x.id === o.mid), { opponent: o.opponent.trim(), deck });
      else tt.matches.push({ id: uid("m"), opponent: o.opponent.trim(), deck, rounds: [] });
      ui.overlay = null; ui.rp = null; break; }
    case "delmatch": ask(inst, "刪除對局", "確定要刪除這場對局嗎？", "刪除", () => { t.matches = t.matches.filter(x => x.id !== el.dataset.m); renderAll(); }, true); return;
    case "rp": ui.rp[el.dataset.k] = el.dataset.k === "bey" ? +v : v; break;
    case "addround": { const m = t.matches.find(x => x.id === el.dataset.m), rp = ui.rp;
      m.rounds.push({ id: uid("r"), result: rp.res, type: rp.type, point: SCORE_TYPES[rp.type].point, bey: m.deck[rp.bey], note: rp.note });
      ui.rp = { m: m.id, bey: rp.bey, res: "win", type: "over", note: "" }; break; }
    case "delround": ask(inst, "刪除回合", "確定要刪除這個回合嗎？", "刪除", () => { const m = t.matches.find(x => x.id === el.dataset.m); m.rounds = m.rounds.filter(r => r.id !== id); renderAll(); }, true); return;
    case "quickround": { const live = S.tournaments.find(x => !x.finished && currentMatch(x)) || S.tournaments.find(x => !x.finished); go("tournaments");
      if (live) { ui.tsel = live.id; if (!currentMatch(live)) return info(inst, "沒有進行中的對局", `「${live.name}」目前沒有進行中的對局，請先新增對局。`); }
      else return info(inst, "沒有進行中的比賽", "請先新增比賽與對局。"); break; }
    /* stats */
    case "statcat": ui.statCat = v; ui.statExpand = false; break;
    case "statexpand": ui.statExpand = !ui.statExpand; break;
    case "statblade": ui.statBlade = v || null; ui.statTab = "combos"; break;
    case "stattab": ui.statTab = v; break;
  }
  renderAll();
}

/* ================= shell ================= */
function renderShell() {
  document.querySelectorAll("[data-shell=view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === SHELL.view)));
  document.querySelectorAll("[data-shell=theme]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === SHELL.theme)));
  const p = document.getElementById("optPanel");
  if (p.hidden) return;
  const radio = (name, v, label, status, note) => `<label><input type="radio" name="${name}" value="${v}" ${SHELL.opts[name] === v ? "checked" : ""} data-opt="${name}"><span><b>${label}</b> <span class="st">${status}</span><br><span class="st">${note}</span></span></label>`;
  p.innerHTML = `<div class="row between" style="display:flex;justify-content:space-between"><h2>設計選項（待決定）</h2><button type="button" class="btn sm" data-shell="opts">關閉</button></div>
    <p class="st" style="margin:0">切換後兩個裝置同時更新。只有「已核准」標示的項目是先前定案。</p>
    <fieldset><legend>手機底部導覽</legend>
      ${radio("nav", "n1", "收藏／配置／＋新增／賽事／更多", "已確認（2026-11-23）", "首頁從左上標誌進入；競賽統計在「更多」。")}
      ${radio("nav", "n2", "首頁／收藏／＋新增／配置／賽事", "未採用", "保留作為比較。")}</fieldset>
    <fieldset><legend>賽事比分板位置</legend>
      ${radio("board", "top", "固定在比賽頁頂部", "已確認（2026-11-23）", "打開比賽就能記錄回合，對局清單在下方。")}
      ${radio("board", "inline", "放在進行中的對局卡內", "未採用", "保留作為比較。")}</fieldset>
    <fieldset><legend>3on3 重複零件提示</legend>
      ${radio("tour3", "on", "開啟（只提示）", "已確認（2026-11-23）", "依官方大賽規則，三顆之間不得重複零件；只提示，不阻擋。")}
      ${radio("tour3", "off", "不加入", "未採用", "保留作為比較。")}</fieldset>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-shell]"); if (!b) return;
  const k = b.dataset.shell;
  if (k === "view") { SHELL.view = b.dataset.v; mountStage(); }
  if (k === "theme") { SHELL.theme = b.dataset.v; renderAll(); }
  if (k === "opts") { const p = document.getElementById("optPanel"); p.hidden = !p.hidden; renderShell(); }
  if (k === "reset") { S = seed(); seedTournaments(S); instances.forEach(i => { i.ui = UI_DEFAULT(); }); renderAll(); }
});
document.getElementById("optPanel").addEventListener("change", e => { const n = e.target.dataset.opt; if (n) { SHELL.opts[n] = e.target.value; renderAll(); } });
if (window.matchMedia("(max-width: 700px)").matches) SHELL.view = "phone";
mountStage();
</script>
</body>
