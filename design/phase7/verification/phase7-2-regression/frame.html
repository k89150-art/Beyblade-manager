<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<script type="module">
// Phase 7-2 integration regression on the CURRENT (7-2d) interface.
// Every check of the 7-2a / 7-2b / 7-2c harnesses is run again here with its
// original id and a category:
//   same    = 仍適用，直接通過（assertion unchanged）
//   entry   = 操作入口改變，改由詳細面板／sheet 驗證（same assertion, reached through the panel）
//   design  = 因核准設計而不再適用，改驗核准後的行為（the replacement assertion is checked）
//   added   = 補充（new coverage asked for in the 7-2d review）
// Runs the REAL source text of script.js (sliced by markers) on the REAL
// index.html markup with the REAL style.css / site-menu.css and catalog files.
// Stubs: sign-in state, write session (switchable), saveData (counted, never
// writes), refreshSelectors, confirm (recorded, answer per step), alert. No Firebase.
import { fingerprintTable, pickCollectionTables } from "/repo/collection-sync.js";
import { attachCatalogNames, getOfficialStockCode, getStockCatalogLabel, getStockVariantLabel } from "/repo/stock-catalog-names.js";
import * as view from "/repo/collection-view.js";

const params = new URLSearchParams(location.search);
const THEME = params.get("theme") || "dark";
const SUITE = params.get("suite") || "a";
const report = data => parent.postMessage({ i72r: true, suite: SUITE, theme: THEME, width: innerWidth, ...data }, "*");
const frame = () => new Promise(r => setTimeout(r, 50));
const settle = async () => { await frame(); await frame(); };
const checks = [];
const check = (id, category, ok, detail = "") => checks.push({ id, category, ok: Boolean(ok), detail: String(detail).slice(0, 400) });

try {
  const html = await (await fetch("/repo/index.html")).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  const links = [...doc.querySelectorAll('link[rel="stylesheet"]')].map(l => l.getAttribute("href")).filter(h => !/^https?:/.test(h));
  await Promise.all(links.map(href => new Promise(ok => { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "/repo/" + href; l.onload = l.onerror = ok; document.head.appendChild(l); })));
  doc.querySelectorAll("script").forEach(s => s.remove());
  document.body.className = doc.body.className;
  document.body.innerHTML = doc.body.innerHTML;
  if (THEME === "beige") document.documentElement.dataset.theme = "beige";
  if (SUITE === "fail") document.getElementById("partViewList").remove();   // forces the fallback (7-2a A-08)

  const src = (await (await fetch("/repo/script.js")).text()).replace(/\r\n/g, "\n");
  const slice = (a, b) => { const i = src.indexOf(a), j = src.indexOf(b, i + 1); if (i < 0 || j < 0) throw new Error("slice " + a); return src.slice(i, j); };
  const code = [
    slice("let inventoryFilterType", "\n") + "\n",
    slice("const partTypes = [", "function normalizeAllModelCells("),
    slice("const RANDOM_BOOSTER_MODELS", "// Phase 7-R: the ratchet rules"),
    slice("function getSeriesFromModel(", "function getConfigStructureModeFromRow("),
    slice("const TABLE_SORT_ORDER", "function sortConfigTable("),
    slice("function addStock(", "function closeConfigActionMenus("),
    slice("function getEditingButtons(", "function normalizeComboValue("),
    slice("function createHistoryRow(", "function findHistoryByComboKey("),
    slice("window.deleteRow = async function", "function getConfigEditCurrentValue("),
    slice("function getTableData(", "/* ===== D-018 collection saves: begin"),
    slice("const QUICK_ADD_TEXT_FIELD_IDS", "async function handleAuthStateChange("),
    slice("const STOCK_ROW_METADATA_KEYS", "function applyDataToTables("),
    slice("function getTotalParts(", "function toHalfWidth("),
    slice("function hasUnsavedDomInteraction(", "function beginDataSession("),
    slice("function installUiSummaryObservers(", "/* ===== Phase 7-2a collection view (R2): begin"),
    slice("/* ===== Phase 7-2a collection view (R2): begin", "/* ===== Phase 7-2b parts model (P2 / U2 / D1, read-only): end")
  ].join("\n");
  const counters = { saveData: 0, confirms: [], alerts: [], answer: true, capture: true, current: true };
  window.confirm = text => { counters.confirms.push(text); return counters.answer; };
  window.alert = text => { counters.alerts.push(text); };
  const [productData, nameData] = await Promise.all([
    fetch("/repo/stock_products_AUTOFILL_SAFE_2026-07-29-v3.json").then(r => r.json()),
    fetch("/repo/beyblade_x_model_chinese_english_2026-08-29.json").then(r => r.json())
  ]);
  const products = attachCatalogNames(productData.stockProducts, nameData.records);
  const api = new Function("deps", `
    const { getOfficialStockCode, getStockCatalogLabel, getStockVariantLabel, view, counters, products } = deps;
    const { ${Object.keys(view).join(", ")} } = view;
    const requestAnimationFrame = callback => setTimeout(callback, 16);
    const DATA_SESSION_STATES = { LOADING: "loading", READY: "ready", ERROR: "error", READONLY: "readonly" };
    const isReadOnly = () => false;
    const requireLogin = () => true;
    // Write gate stub: switchable to imitate a session that is no longer current (account switch / conflict hold).
    const dataSessionGuard = { captureWriteSession: () => (counters.capture ? {} : null), isWriteSessionCurrent: () => counters.current, snapshot: () => ({ state: "ready" }) };
    const refreshSelectors = () => {};
    const renderStockAutoPreview = () => {};
    const askDeleteReasonForConfig = async () => null;
    const saveData = () => { counters.saveData += 1; };
    let currentUser = { uid: "user-a" };
    let stockProductsByRecordId = new Map(products.filter(p => p.autoFillEnabled && !p.needsReview && p.recordId).map(p => [String(p.recordId).trim(), p]));
    ${code}
    function load(data) {
      clearAllTables();
      data.beybladeTable.forEach(item => createBeybladeRow(item.cells, item.mainStockName, item));
      data.partTable.forEach(item => createPartRow(item.cells));
      data.historyTable.forEach(item => createHistoryRow(item));
      data.configTable.forEach(item => createConfigRow(item.cells, item.mainStockName));
      sortBeybladeTable();
    }
    function refreshUi() { updateUiSummaries(); updateResponsiveTableCells(); applyInventoryFilters(); scheduleCollectionViewRender(); }
    return { load, refreshUi, collectCurrentData, installCollectionView, installUiSummaryObservers, setCollectionTab, applyCollectionHash, computeCollectionPartsModel,
      resetQuickAddFormsForAccountChange, resetCollectionViewState, isCollectionViewActive, readStoredViewMode, applyInventoryFilters, hasUnsavedDomInteraction,
      render: renderCollectionView, state: () => collectionViewState, setFilter: v => { inventoryFilterType = v; } };
  `)({ getOfficialStockCode, getStockCatalogLabel, getStockVariantLabel, view, counters, products });

  // ---- Data: 7-2a set (duplicates, set, whitespace) and 7-2b / 7-2c set.
  const s72a = (code, layer, fix, axis, extra = {}) => ({ cells: [code, layer, "-", "-", "-", "-", "-", fix, axis], mainStockName: "-", stockAutoFilled: "true", stockRecordId: code, stockProductCode: code, stockAssemblySystem: "STANDARD", stockRatchetMode: "standard", ...extra });
  const DATA_A = {
    beybladeTable: [
      s72a("BX-01", "蒼龍神劍", "3-60", "F"),
      s72a("BX-01", "蒼龍神劍", "3-60", "F"),
      s72a("BX-01", "蒼龍神劍", "3-60", "F", { customNote: "keep me" }),
      s72a("BX-00", "歐比王肯諾比", "4-60", "P", { stockRecordId: "BX-00-01-01", stockSetId: "BX-00-01", stockSetInstanceId: "BX-00-01-aaaa" }),
      s72a("BX-00", "葛里維斯將軍", "3-80", "HN", { stockRecordId: "BX-00-01-02", stockSetId: "BX-00-01", stockSetInstanceId: "BX-00-01-aaaa" }),
      { cells: ["CX-03", "紋章鎖金屬超越S", "紋章鎖", "超越/金屬", "超越", "金屬", "S", "4-55", "LO"], mainStockName: "", stockAutoFilled: "true", stockRecordId: "CX-03", stockAssemblySystem: "CX_4P" },
      { cells: ["CX-01", "蒼龍勇  氣S", "蒼龍", "勇  氣", "-", "-", "S", "6-60", "V"], mainStockName: "勇  氣", stockAutoFilled: "true", stockRecordId: "CX-01", stockAssemblySystem: "CX_3P" },
      { cells: ["CX-11", "-", "帝王", "威能", "-", "-", "-", "-", "Op"], mainStockName: "威能", stockAutoFilled: false },
      { cells: ["UX-01", "雙  空白", "-", "-", "-", "-", "-", "1-60", "A"], mainStockName: "-" },
      { cells: ["UX-02", "全形　空白", "-", "-", "-", "-", "-", "3-70", "H"], mainStockName: "-" },
      { cells: ["UX-03", "不斷行 空白", "-", "-", "-", "-", "-", "3-80", "FB"], mainStockName: "-" },
      { cells: ["UX-04", "定位\t字元", "-", "-", "-", "-", "-", "9-60", "LR"], mainStockName: "-" },
      { cells: ["UX-06", "  前後空白  ", "-", "-", "-", "-", "-", "4-60", "T"], mainStockName: "-" }
    ],
    partTable: [
      { cells: ["固鎖", "3-60", "2"] },
      { cells: ["軸心", "雙  空白", "1"] },
      { cells: ["上蓋", "全形　空白", "1"] },
      { cells: ["軸心", "F", "1"] },
      { cells: ["軸心", "F", "3"] }
    ],
    configTable: [
      { cells: ["CX-CUSTOM", "紋章鎖金屬超越S", "紋章鎖", "超越/金屬", "超越", "金屬", "S", "4-55", "LO"], mainStockName: "" },
      { cells: ["BX-CUSTOM", "雙  空白", "-", "-", "-", "-", "-", "3-60", "F"], mainStockName: "-" }
    ],
    historyTable: [{ model: "BX-CUSTOM", combo: "蒼龍  神劍", fix: "3-60", axis: "F", result: "好用", note: "備註  兩格", date: "2026/11/24", comboKey: "k1" }]
  };
  const auto = (code, recordId, layer, fix, axis, extra = {}) => ({ cells: [code, layer, "-", "-", "-", "-", "-", fix, axis], mainStockName: "-", stockAutoFilled: "true", stockRecordId: recordId, stockProductCode: code, stockAssemblySystem: "STANDARD", ...extra });
  const DATA_B = {
    beybladeTable: [
      auto("UX-01", "UX-01", "蒼龍爆刃", "1-60", "A"),
      auto("BX-01", "BX-01", "蒼龍神劍", "3-60", "F"),
      auto("BX-01", "BX-01", "蒼龍神劍", "3-60", "F"),
      auto("BX-00", "BX-00-01-01", "歐比王肯諾比", "4-60", "P", { stockSetId: "BX-00-01", stockSetInstanceId: "set-1" }),
      auto("BX-00", "BX-00-01-02", "葛里維斯將軍", "3-80", "HN", { stockSetId: "BX-00-01", stockSetInstanceId: "set-1" }),
      { cells: ["BX-04", "騎士重盾", "-", "-", "-", "-", "-", "3-80", "N"], mainStockName: "-" },
      { cells: ["CX-03", "紋章鎖金屬超越S", "紋章鎖", "超越/金屬", "超越", "金屬", "S", "4-55", "LO"], mainStockName: "", stockAutoFilled: "true", stockRecordId: "CX-03", stockAssemblySystem: "CX_4P" }
    ],
    partTable: [{ cells: ["固鎖", "3-60", "2"] }, { cells: ["軸心", "R", "1"] }, { cells: ["軸心", "F", "1"] }, { cells: ["軸心", "F", "3"] }],
    configTable: [
      { cells: ["BX-01 CUSTOM", "蒼龍神劍", "-", "-", "-", "-", "-", "3-60", "F"], mainStockName: "-" },
      { cells: ["BX-CUSTOM", "惡魔重錘", "-", "-", "-", "-", "-", "3-60", "R"], mainStockName: "-" },
      { cells: ["BX-CUSTOM", "魔導幻箭", "-", "-", "-", "-", "-", "3-60", "R"], mainStockName: "-" },
      { cells: ["BX-CUSTOM", "騎士重盾", "-", "-", "-", "-", "-", "3-60", "LF"], mainStockName: "-" },
      { cells: ["CX-CUSTOM", "紋章鎖金屬超越S", "紋章鎖", "超越/金屬", "超越", "金屬", "S", "4-55", "LO"], mainStockName: "" }
    ],
    historyTable: []
  };
  const DATA = SUITE === "a" || SUITE === "fail" ? DATA_A : DATA_B;

  const collect = () => { const out = api.collectCurrentData(); delete out.updatedAt; const t = pickCollectionTables(out); return { json: JSON.stringify(t), prints: Object.values(t).map(fingerprintTable).join("|"), tables: t }; };
  const rowsOf = id => Array.from(document.querySelectorAll(`#${id} tbody tr`));
  const sameRows = (a, b) => a.length === b.length && a.every((row, i) => row === b[i]);
  const text = id => document.getElementById(id)?.textContent;
  const sheetMode = () => innerWidth <= 820;
  const detail = kind => document.getElementById(kind === "stock" ? "stockDetail" : "partDetail");
  const detailText = kind => detail(kind).querySelector("[data-detail-body]").textContent.replace(/\s+/g, " ").trim();
  const items = list => [...document.querySelectorAll(`#${list} [data-view-select]`)];
  const itemLabel = a => (a.querySelector(".cv-code, .cv-type")?.textContent || "") + " " + a.querySelector(".cv-title").textContent;
  const stockItem = (code, nth = 0, title) => items("stockViewList").filter(a => a.querySelector(".cv-code").textContent === code && (!title || a.querySelector(".cv-title").textContent === title))[nth];
  const partItem = (type, name) => items("partViewList").find(a => a.querySelector(".cv-type").textContent === type && a.querySelector(".cv-title").textContent === name);
  const open = async item => { item.click(); await settle(); };
  const panelButtons = (kind, action) => [...detail(kind).querySelectorAll(`[data-view-action="${action}"]`)];
  const setSelect = async (id, value) => { const el = document.getElementById(id); el.value = value; el.dispatchEvent(new Event("change", { bubbles: true })); await settle(); };
  const typeInto = async (id, value) => { const el = document.getElementById(id); el.value = value; el.dispatchEvent(new Event("input", { bubbles: true })); await settle(); };
  const lastConfirm = () => counters.confirms.at(-1);
  // The page init (outside the sliced source) wires the type chips and the parts search like this.
  const wirePageInit = () => {
    document.querySelectorAll("[data-inventory-filter]").forEach(button => button.addEventListener("click", () => {
      api.setFilter(button.dataset.inventoryFilter || "all");
      document.querySelectorAll("[data-inventory-filter]").forEach(c => { c.classList.toggle("active", c === button); c.setAttribute("aria-pressed", String(c === button)); });
      api.applyInventoryFilters();
    }));
    document.getElementById("inventorySearchInput").addEventListener("input", () => api.applyInventoryFilters());
  };

  api.load(DATA);
  api.refreshUi(); await frame();
  const visible = collect();   // tables as they render before the display layer starts (visible, not clipped)
  const rowsBefore = { b: rowsOf("beybladeTable"), p: rowsOf("partTable") };
  api.installCollectionView();
  api.installUiSummaryObservers();
  wirePageInit();
  api.refreshUi(); await settle();
  const installed = collect();
  const base = installed;
  const unchanged = () => collect().json === base.json && collect().prints === base.prints && counters.saveData === 0;

  if (SUITE === "fail") {
    // ===== 7-2a A-08 (fallback) =====
    const box = document.getElementById("partSourceBox");
    const failed = !api.isCollectionViewActive();
    check("A-08 fallback active", "same", failed && document.body.classList.contains("collection-view-failed"));
    check("A-08 tables visible again", "same", !box.classList.contains("is-source-hidden") && !box.hasAttribute("inert") && !document.getElementById("beybladeSourceBox").classList.contains("is-source-hidden"));
    check("A-08 both sections shown, tabs hidden", "same", !document.getElementById("collectionSection").hidden && !document.getElementById("inventorySection").hidden && document.getElementById("collectionTabs").hidden);
    check("A-08 data unchanged", "same", installed.json === visible.json && installed.prints === visible.prints);
    check("A-08 no save", "same", counters.saveData === 0);
    check("A-08 detail panels, scrims and list controls hidden in the fallback", "added", [...document.querySelectorAll(".cv-detail, .cv-detail-scrim, [data-list-controls]")].every(el => el.hidden && getComputedStyle(el).display === "none"));
    check("A-08 original row buttons usable again (not inert)", "added", rowsOf("beybladeTable")[0].querySelector('button[onclick^="deleteRow("]') && !rowsOf("beybladeTable")[0].closest("[inert]"));
    report({ ok: true, checks });
  } else if (SUITE === "a") {
    // ===== 7-2a =====
    const sbox = document.getElementById("beybladeSourceBox"), pbox = document.getElementById("partSourceBox");
    check("K-1 boxes clip-hidden + inert + aria-hidden", "same", [sbox, pbox].every(b => b.classList.contains("is-source-hidden") && b.hasAttribute("inert") && b.getAttribute("aria-hidden") === "true"));
    check("K-1 no display/visibility on boxes or tables", "same", [sbox, pbox, document.getElementById("beybladeTable"), document.getElementById("partTable")].every(el => getComputedStyle(el).display !== "none" && getComputedStyle(el).visibility === "visible" && !el.hidden));
    check("A-04 installed (clip) == visible (cells, mainStockName, metadata, order, prints)", "same", installed.json === visible.json && installed.prints === visible.prints);
    const states = [];
    const step = async (label, fn) => { await fn(); api.refreshUi(); await settle(); const c = collect(); states.push({ label, same: c.json === visible.json && c.prints === visible.prints }); };
    for (let i = 0; i < 5; i++) {
      await step(`tab parts ${i}`, () => document.getElementById("collectionTabParts").click());
      await step(`tab stock ${i}`, () => document.getElementById("collectionTabStock").click());
    }
    await step("keyboard ArrowRight", () => document.getElementById("collectionTabs").dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true })));
    await step("keyboard Home", () => document.getElementById("collectionTabs").dispatchEvent(new KeyboardEvent("keydown", { key: "Home", bubbles: true })));
    await step("hash #inventorySection", () => api.applyCollectionHash("#inventorySection"));
    await step("hash #add-collection", () => api.applyCollectionHash("#add-collection"));
    await step("toggle add panels", () => { document.getElementById("collectionAddToggle").click(); document.getElementById("collectionAddToggle").click(); });
    await step("filter 軸心", () => api.setFilter("軸心"));
    await step("filter 上蓋 (hides the double-space part in the view)", () => api.setFilter("上蓋"));
    await step("search", () => { document.getElementById("inventorySearchInput").value = "F"; });
    await step("filter reset", () => { api.setFilter("all"); document.getElementById("inventorySearchInput").value = ""; });
    // 7-2c / 7-2d display operations on the same data (added).
    await step("select a part, open the panel / sheet", async () => { api.setCollectionTab("parts"); await settle(); await open(partItem("軸心", "雙  空白") || items("partViewList")[0]); });
    await step("close the panel / sheet", () => document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true })));
    await step("V3 card then list", async () => { document.querySelector('#inventorySection [data-view-mode="card"]').click(); await settle(); document.querySelector('#inventorySection [data-view-mode="list"]').click(); });
    await step("status over, sort avail", async () => { await setSelect("partStatusFilter", "over"); await setSelect("partSortSelect", "avail"); });
    await step("stock series CX, sort name, select", async () => { api.setCollectionTab("stock"); await settle(); document.querySelector('[data-stock-series="CX"]').click(); await setSelect("stockSortSelect", "name"); await open(items("stockViewList")[0]); });
    await step("controls reset", async () => { api.resetCollectionViewState(); });
    check("A-01/A-02 every tab/hash/filter/search step keeps collectCurrentData and prints identical", "same", states.slice(0, 19).every(s => s.same), states.filter(s => !s.same).map(s => s.label).join(","));
    check("A-01/A-02 also holds for panel / sheet, V3, status, sort and selection steps", "added", states.slice(19).every(s => s.same), states.slice(19).filter(s => !s.same).map(s => s.label).join(","));
    check("A-02 original <tr> identity and order unchanged", "same", sameRows(rowsOf("beybladeTable"), rowsBefore.b) && sameRows(rowsOf("partTable"), rowsBefore.p));
    check("A-02 no original part row hidden by the filter", "same", rowsOf("partTable").every(r => !r.hidden));
    check("A-05 no saveData during display operations", "same", counters.saveData === 0, counters.saveData);
    api.setFilter("all"); api.refreshUi(); await settle();
    const stockArticles = document.querySelectorAll("#stockViewList .cv-item");
    const model = api.computeCollectionPartsModel();
    check("R2 one item per stock row (G2: duplicates and set members separate)", "same", stockArticles.length === rowsOf("beybladeTable").length, `${stockArticles.length}/${rowsOf("beybladeTable").length}`);
    check("R2 one item per part row → P2 (7-2b): one item per held part kind; same-name rows share one card", "design",
      document.querySelectorAll("#partViewList .cv-part-item").length === model.items.length && model.items.find(e => e.type === "軸心" && e.name === "F").extraRows.length === 2);
    check("R2 tab counts (parts tab = part kinds since 7-2b)", "design", document.getElementById("collectionTabStockCount").textContent === String(rowsOf("beybladeTable").length) && document.getElementById("collectionTabPartsCount").textContent === String(model.items.length));
    api.setFilter("軸心"); api.refreshUi(); await settle();
    check("R2 filter applies to the view only", "same", [...document.querySelectorAll("#partViewList .cv-part-item .cv-type")].every(t => t.textContent === "軸心") && document.querySelectorAll("#partViewList .cv-part-item").length > 0 && rowsOf("partTable").length === 5);
    api.setFilter("all"); api.refreshUi(); await settle();

    api.setCollectionTab("stock"); document.getElementById("collectionAddToggle").click(); await settle();
    api.applyCollectionHash("#add-part"); await settle();
    check("D-020 #add-part: parts tab, form open, focus #partName", "same", document.activeElement?.id === "partName" && !document.getElementById("inventorySection").hidden && document.getElementById("collectionSection").hidden && !document.getElementById("inventoryAddBody").hidden);
    api.applyCollectionHash("#add-collection"); await settle();
    check("D-020 #add-collection: stock tab, form open, focus #model", "same", document.activeElement?.id === "model" && !document.getElementById("collectionSection").hidden && document.getElementById("inventorySection").hidden && !document.getElementById("collectionAddBody").hidden);

    const modelField = document.getElementById("model");
    modelField.value = "UX-01"; document.getElementById("partName").value = "半途"; document.getElementById("partCount").value = "2"; document.getElementById("partType").value = "軸心";
    document.getElementById("collectionAddToggle").click(); await settle();
    check("Q1 collapse hides the form", "same", document.getElementById("collectionAddBody").hidden && document.getElementById("collectionAddToggle").getAttribute("aria-expanded") === "false");
    document.getElementById("collectionAddToggle").click(); await settle();
    check("Q1 collapse/expand keeps same-account input (same element)", "same", modelField.value === "UX-01" && document.getElementById("model") === modelField);
    api.resetQuickAddFormsForAccountChange("user-a", "user-a");
    check("Q1-04 same UID keeps input", "same", modelField.value === "UX-01" && document.getElementById("partName").value === "半途");
    document.getElementById("inventorySearchInput").value = "F"; api.setFilter("軸心");
    await open(stockItem("BX-01", 1));
    api.resetQuickAddFormsForAccountChange("user-a", "user-b"); await settle();
    check("Q1-01 A→B clears add forms", "same", ["model", "partName", "partCount"].every(id => document.getElementById(id).value === "") && document.getElementById("partType").value === "上蓋");
    check("Q1 A→B clears view search/filter", "same", document.getElementById("inventorySearchInput").value === "" && document.querySelector('[data-inventory-filter="all"]').getAttribute("aria-pressed") === "true");
    check("Q1 A→B closes the detail panel / sheet and forgets the selection", "added", api.state().selection === null && !document.querySelector(".cv-item.is-selected") && !document.querySelector(".cv-detail.is-open") && document.querySelectorAll(".cv-detail-scrim:not([hidden])").length === 0);
    check("Q1 account reset leaves data untouched", "same", collect().json === visible.json && counters.saveData === 0);

    // K4-01 / K4-06 / K4-04 through the panel / sheet.
    api.setCollectionTab("stock"); api.refreshUi(); await settle();
    const bx01Rows = rowsOf("beybladeTable").filter(r => r.cells[0].innerText === "BX-01");

      const wrapForward = document.activeElement === focusables[0];
      focusables[0].focus();
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Tab", shiftKey: true, bubbles: true, cancelable: true }));
      const wrapBack = document.activeElement === focusables.at(-1);
      items("stockViewList")[0].focus();
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Tab", bubbles: true, cancelable: true }));
      check("sheet: Tab / Shift+Tab stay inside; focus outside is pulled back", "added", wrapForward && wrapBack && stockDetail.contains(document.activeElement), `${wrapForward} ${wrapBack}`);
    } else {
      check("panel: region beside the list, no scrim, focus stays on the item", "added", stockDetail.getAttribute("role") === "region" && scrim().hidden && document.activeElement?.dataset?.viewSelect === "stock");
      const focusables = [...stockDetail.querySelectorAll("button:not([disabled])")].filter(b => b.getClientRects().length);
      focusables.at(-1).focus();
      const evt = new KeyboardEvent("keydown", { key: "Tab", bubbles: true, cancelable: true });
      document.dispatchEvent(evt);
      check("panel: no focus trap on desktop (Tab is not intercepted)", "added", !evt.defaultPrevented);
    }
    // Hidden by a filter: the panel still targets the original row.
    const prevFilter = document.querySelector('[data-stock-series="CX"]');
    prevFilter.click(); await settle();   // (on phones a script click: the scrim blocks real clicks)
    check("filtered out: the selected item is not in the list but the panel keeps it", "added", !stockItem("BX-01") && /BX-01/.test(detailText("stock")) && /蒼龍神劍/.test(detailText("stock")));
    counters.answer = false;
    panelButtons("stock", "delete")[0].click(); await settle();
    check("filtered out: the confirmation is for the selected row", "added", lastConfirm()?.startsWith("確定要刪除「BX-01 蒼龍神劍」嗎？") && unchanged());
    counters.answer = true;
    panelButtons("stock", "delete")[0].click(); await settle();
    check("filtered out: confirm removes exactly that row", "added", !bx01Second.isConnected && rowsOf("beybladeTable").filter(r => r.cells[0].innerText === "BX-01").length === 1 && counters.saveData === 1);
    check("after the delete: panel / sheet closed, no scrim, focus on the tab (item gone)", "added", api.state().selection === null && !stockDetail.classList.contains("is-open") && scrim().hidden
      && (phone ? document.activeElement?.dataset?.collectionTab === "stock" : true), document.activeElement?.outerHTML?.slice(0, 60));
    counters.saveData = 0;
    document.querySelector('[data-stock-series="all"]').click(); await settle();
    const base2 = collect();
    const unchanged2 = () => collect().json === base2.json && counters.saveData === 0;

    // Set member changes after the panel was drawn.
    await open(stockItem("BX-00", 1));
    const obi = rowsOf("beybladeTable").find(r => r.cells[1].innerText === "歐比王肯諾比");
    const before = counters.confirms.length;
    const oldSet = obi.dataset.stockSetInstanceId;
    delete obi.dataset.stockSetInstanceId;
    panelButtons("stock", "delete")[0].click(); await frame();
    check("set member metadata changed after display → blocked, no confirm", "added", counters.confirms.length === before && counters.alerts.at(-1) === "資料已更新，請確認清單後再操作。");
    obi.dataset.stockSetInstanceId = oldSet; await settle();
    await open(stockItem("BX-00", 1));
    obi.cells[8].textContent = "XX";
    panelButtons("stock", "delete")[0].click(); await frame();
    check("set member content changed after display → blocked, no confirm", "added", counters.confirms.length === before);
    obi.cells[8].textContent = "P"; await settle();
    check("set checks left the data unchanged", "added", unchanged2());

    // Write gate (session no longer current, e.g. account switch / conflict hold during the confirm).
    await open(stockItem("UX-01"));
    counters.current = false;
    const ux = rowsOf("beybladeTable").find(r => r.cells[0].innerText === "UX-01");
    panelButtons("stock", "delete")[0].click(); await settle();
    check("write gate: confirmed but the session is no longer current → nothing removed, no save", "added", ux.isConnected && unchanged2());
    counters.current = true;
    counters.capture = false;
    const before2 = counters.confirms.length;
    panelButtons("stock", "delete")[0].click(); await settle();
    check("write gate: no write session → no confirmation, nothing removed", "added", counters.confirms.length === before2 && ux.isConnected && unchanged2());
    counters.capture = true;

    // Sheet / panel open during reset, rebuild, sign-out and width changes.
    const resetCase = async (label, fn) => {
      await open(stockItem("UX-01"));
      await fn(); await settle();
      return { label, ok: api.state().selection === null && !document.querySelector(".cv-detail.is-open") && document.querySelectorAll(".cv-detail-scrim:not([hidden])").length === 0
        && !document.querySelector(".cv-item.is-selected") && !(document.activeElement && document.activeElement.closest(".cv-detail.is-sheet")) };
    };
    const cases = [
      await resetCase("account change", () => api.resetCollectionViewState()),
      await resetCase("remote rebuild", () => api.load(DATA))
    ];
    check("panel / sheet open → account change: closed, no scrim, no trap, no stale target", "added", cases[0].ok);
    check("panel / sheet open → remote rebuild: closed with notice, nothing reselected", "added", cases[1].ok && (phone || /資料已更新，請重新選擇。/.test(detailText("stock"))));
    const signOut = await resetCase("sign-out", () => { api.load({ beybladeTable: [], partTable: [], configTable: [], historyTable: [] }); });
    check("panel / sheet open → sign-out (tables cleared): closed, no scrim", "added", signOut.ok);
    api.load(DATA); await settle();
    // Width change across the breakpoint while open.
    await open(stockItem("UX-01"));
    const host = frameElement;
    const startWidth = host.style.width;
    host.style.width = phone ? "900px" : "700px"; await new Promise(r => setTimeout(r, 250)); await settle();
    // A hidden browser pane does not run the rendering step, so the media query "change" event may not fire.
    // In that case the page's own MediaQueryList gets the same event (its listener is what is checked).
    const mqlEventFired = !stockDetail.classList.contains("is-open") || !phone;
    if (!mqlEventFired) { api.state().sheetQuery.dispatchEvent(new Event("change")); await settle(); }
    const crossed = { mqlEventFired, phoneNow: sheetMode(), open: stockDetail.classList.contains("is-open"), scrim: !scrim().hidden, display: getComputedStyle(stockDetail).display };
    check("width change across 820/821 while open: no sheet, no scrim left; panel shows the selection on desktop", "added",
      !crossed.open && !crossed.scrim && (crossed.phoneNow ? crossed.display === "none" : (crossed.display !== "none" && /UX-01/.test(detailText("stock")))), JSON.stringify(crossed));
    check("width change: focus is not left inside a hidden panel", "added", !(document.activeElement?.closest?.(".cv-detail") && getComputedStyle(document.activeElement.closest(".cv-detail")).display === "none"));
    host.style.width = startWidth; await new Promise(r => setTimeout(r, 250)); await settle();
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true })); await settle();

    // Close returns focus; missing item → tab.
    await open(stockItem("BX-04"));
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: phone, cancelable: true }));
    if (!phone) { detail("stock").focus(); document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true })); }
    await settle();
    check("close returns focus to the same item", "added", document.activeElement?.dataset?.viewSelect === "stock" && itemLabel(document.activeElement) === "BX-04 騎士重盾", document.activeElement?.outerHTML?.slice(0, 80));
    await open(stockItem("BX-04"));
    const bx04 = rowsOf("beybladeTable").find(r => r.cells[0].innerText === "BX-04");
    bx04.remove(); await settle();   // the item disappears while open
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true })); await settle();
    check("item gone while open: closed, focus on a safe target (tab or list item), not in a hidden sheet", "added", !stockDetail.classList.contains("is-open") && scrim().hidden
      && (document.activeElement?.dataset?.collectionTab === "stock" || document.activeElement?.dataset?.viewSelect === "stock" || !phone), document.activeElement?.outerHTML?.slice(0, 80));
    api.load(DATA); await settle();

    // Phone edit: the sheet closes; the row editor works for save and cancel.
    counters.saveData = 0;
    api.setCollectionTab("parts"); await settle();
    const f1 = rowsOf("partTable").filter(r => r.cells[1].innerText === "F")[0];
    await open(partItem("軸心", "F"));
    panelButtons("parts", "edit")[0].click(); await settle();
    check("edit: sheet closed (phones), no scrim, row editor focused", "added", !detail("parts").classList.contains("is-open") && detail("parts").parentElement.querySelector(".cv-detail-scrim").hidden && f1.contains(document.activeElement) && f1.dataset.editing === "true");
    const countInput = f1.cells[2].querySelector("input");
    countInput.focus(); countInput.value = "4";
    window.saveEditRow(f1.cells[f1.cells.length - 1].querySelector('button[onclick^="saveEditRow("]'), "part"); await settle();
    check("edit: save writes once and updates the row", "added", f1.cells[2].innerText === "4" && f1.dataset.editing !== "true" && counters.saveData === 1);
    await open(partItem("軸心", "F"));
    panelButtons("parts", "edit")[0].click(); await settle();
    f1.cells[1].querySelector("input").value = "不保存";
    window.cancelEditRow(f1.cells[f1.cells.length - 1].querySelector('button[onclick^="cancelEditRow("]'), "part"); await settle();
    check("edit: cancel restores, no save", "added", f1.cells[1].innerText === "F" && counters.saveData === 1 && document.getElementById("partSourceBox").classList.contains("is-source-hidden"));

    check("layout no horizontal overflow", "same", document.documentElement.scrollWidth <= innerWidth + 1, `${document.documentElement.scrollWidth}/${innerWidth}`);
    report({ ok: true, checks });
  }
} catch (error) {
  report({ ok: false, error: String(error && error.stack || error), checks });
}
</script>
</body>
</html>
