<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<script type="module">
// Phase 7-2c integration check (V3 / stock filters and sorting / part status). Runs the REAL source text of
// script.js (sliced by markers) on the REAL index.html markup with the REAL
// style.css / site-menu.css and the REAL catalog files, in a browser.
// Stubs: sign-in state, write session, saveData (counted, never writes),
// refreshSelectors, confirm (recorded, answer chosen per step), alert. No Firebase.
import { fingerprintTable, pickCollectionTables } from "/repo/collection-sync.js";
import { attachCatalogNames, getOfficialStockCode, getStockCatalogLabel, getStockVariantLabel } from "/repo/stock-catalog-names.js";
import * as view from "/repo/collection-view.js";

const params = new URLSearchParams(location.search);
const THEME = params.get("theme") || "dark";
const report = data => parent.postMessage({ i72c: true, theme: THEME, width: innerWidth, ...data }, "*");
const frame = () => new Promise(r => setTimeout(r, 60));
const checks = [];
const check = (id, ok, detail = "") => checks.push({ id, ok: Boolean(ok), detail: String(detail).slice(0, 400) });

try {
  const html = await (await fetch("/repo/index.html")).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  const links = [...doc.querySelectorAll('link[rel="stylesheet"]')].map(l => l.getAttribute("href")).filter(h => !/^https?:/.test(h));
  await Promise.all(links.map(href => new Promise(ok => { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "/repo/" + href; l.onload = l.onerror = ok; document.head.appendChild(l); })));
  doc.querySelectorAll("script").forEach(s => s.remove());
  document.body.className = doc.body.className;
  document.body.innerHTML = doc.body.innerHTML;
  if (THEME === "beige") document.documentElement.dataset.theme = "beige";

  const src = (await (await fetch("/repo/script.js")).text()).replace(/\r\n/g, "\n");
  const slice = (a, b) => { const i = src.indexOf(a), j = src.indexOf(b, i + 1); if (i < 0 || j < 0) throw new Error("slice " + a); return src.slice(i, j); };
  const code = [
    slice("let inventoryFilterType", "\n") + "\n",
    slice("const partTypes = [", "function normalizeAllModelCells("),
    slice("const RANDOM_BOOSTER_MODELS", "// Phase 7-R: the ratchet rules"),
    slice("function getSeriesFromModel(", "function getConfigStructureModeFromRow("),
    slice("const TABLE_SORT_ORDER", "function sortConfigTable("),
    slice("function addStock(", "function closeConfigActionMenus("),
    slice("function getEditingButtons(", "function normalizeComboValue("),
    slice("function createHistoryRow(", "function findHistoryByComboKey("),
    slice("window.deleteRow = async function", "function getConfigEditCurrentValue("),
    slice("function getTableData(", "/* ===== D-018 collection saves: begin"),
    slice("const QUICK_ADD_TEXT_FIELD_IDS", "async function handleAuthStateChange("),
    slice("const STOCK_ROW_METADATA_KEYS", "function applyDataToTables("),
    slice("function getTotalParts(", "function toHalfWidth("),
    slice("function installUiSummaryObservers(", "/* ===== Phase 7-2a collection view (R2): begin"),
    slice("/* ===== Phase 7-2a collection view (R2): begin", "/* ===== Phase 7-2b parts model (P2 / U2 / D1, read-only): end")
  ].join("\n");
  const counters = { saveData: 0, confirms: [], alerts: [], answer: true };
  window.confirm = text => { counters.confirms.push(text); return counters.answer; };
  window.alert = text => { counters.alerts.push(text); };
  const [productData, nameData] = await Promise.all([
    fetch("/repo/stock_products_AUTOFILL_SAFE_2026-07-29-v3.json").then(r => r.json()),
    fetch("/repo/beyblade_x_model_chinese_english_2026-08-29.json").then(r => r.json())
  ]);
  const products = attachCatalogNames(productData.stockProducts, nameData.records);
  const api = new Function("deps", `
    const { getOfficialStockCode, getStockCatalogLabel, getStockVariantLabel, view, counters, products } = deps;
    const { ${Object.keys(view).join(", ")} } = view;
    const requestAnimationFrame = callback => setTimeout(callback, 16);
    const DATA_SESSION_STATES = { LOADING: "loading", READY: "ready", ERROR: "error", READONLY: "readonly" };
    const isReadOnly = () => false;
    const requireLogin = () => true;
    const dataSessionGuard = { captureWriteSession: () => ({}), isWriteSessionCurrent: () => true, snapshot: () => ({ state: "ready" }) };
    const refreshSelectors = () => {};
    const renderStockAutoPreview = () => {};
    const askDeleteReasonForConfig = async () => null;
    const saveData = () => { counters.saveData += 1; };
    let currentUser = { uid: "user-a" };
    let stockProductsByRecordId = new Map(products.filter(p => p.autoFillEnabled && !p.needsReview && p.recordId).map(p => [String(p.recordId).trim(), p]));
    ${code}
    function load(data) {
      clearAllTables();
      data.beybladeTable.forEach(item => createBeybladeRow(item.cells, item.mainStockName, item));
      data.partTable.forEach(item => createPartRow(item.cells));
      data.historyTable.forEach(item => createHistoryRow(item));
      data.configTable.forEach(item => createConfigRow(item.cells, item.mainStockName));
      sortBeybladeTable();
    }
    return { load, collectCurrentData, installCollectionView, installUiSummaryObservers, setCollectionTab, computeCollectionPartsModel,
      setFilter: v => { inventoryFilterType = v; }, resetCollectionViewState, readStoredViewMode, applyInventoryFilters, state: () => collectionViewState };
  `)({ getOfficialStockCode, getStockCatalogLabel, getStockVariantLabel, view, counters, products });

  const auto = (code, recordId, layer, fix, axis, extra = {}) => ({ cells: [code, layer, "-", "-", "-", "-", "-", fix, axis], mainStockName: "-", stockAutoFilled: "true", stockRecordId: recordId, stockProductCode: code, stockAssemblySystem: "STANDARD", ...extra });
  const DATA = {
    beybladeTable: [
      auto("UX-01", "UX-01", "蒼龍爆刃", "1-60", "A"),
      auto("BX-01", "BX-01", "蒼龍神劍", "3-60", "F"),
      auto("BX-01", "BX-01", "蒼龍神劍", "3-60", "F"),
      auto("BX-00", "BX-00-01-01", "歐比王肯諾比", "4-60", "P", { stockSetId: "BX-00-01", stockSetInstanceId: "set-1" }),
      auto("BX-00", "BX-00-01-02", "葛里維斯將軍", "3-80", "HN", { stockSetId: "BX-00-01", stockSetInstanceId: "set-1" }),
      { cells: ["BX-04", "騎士重盾", "-", "-", "-", "-", "-", "3-80", "N"], mainStockName: "-" },               // manual: no English name
      { cells: ["CX-03", "紋章鎖金屬超越S", "紋章鎖", "超越/金屬", "超越", "金屬", "S", "4-55", "LO"], mainStockName: "", stockAutoFilled: "true", stockRecordId: "CX-03", stockAssemblySystem: "CX_4P" }
    ],
    partTable: [
      { cells: ["固鎖", "3-60", "2"] },
      { cells: ["軸心", "R", "1"] },
      { cells: ["軸心", "F", "1"] },
      { cells: ["軸心", "F", "3"] }
    ],
    configTable: [
      { cells: ["BX-01 CUSTOM", "蒼龍神劍", "-", "-", "-", "-", "-", "3-60", "F"], mainStockName: "-" },
      { cells: ["BX-CUSTOM", "惡魔重錘", "-", "-", "-", "-", "-", "3-60", "R"], mainStockName: "-" },
      { cells: ["BX-CUSTOM", "魔導幻箭", "-", "-", "-", "-", "-", "3-60", "R"], mainStockName: "-" },
      { cells: ["BX-CUSTOM", "騎士重盾", "-", "-", "-", "-", "-", "3-60", "LF"], mainStockName: "-" },
      { cells: ["CX-CUSTOM", "紋章鎖金屬超越S", "紋章鎖", "超越/金屬", "超越", "金屬", "S", "4-55", "LO"], mainStockName: "" }
    ],
    historyTable: []
  };

  const collect = () => { const out = api.collectCurrentData(); delete out.updatedAt; const t = pickCollectionTables(out); return { json: JSON.stringify(t), prints: Object.values(t).map(fingerprintTable).join("|"), tables: t }; };
  const rowsOf = id => Array.from(document.querySelectorAll(`#${id} tbody tr`));
  const text = id => document.getElementById(id)?.textContent;

  api.load(DATA);
  api.installCollectionView();
  api.installUiSummaryObservers();
  await frame(); await frame();
  const base = collect();
  const STOCK_DOM = rowsOf("beybladeTable");
  const PART_DOM = rowsOf("partTable");
  const sameRows = () => rowsOf("beybladeTable").length === STOCK_DOM.length && rowsOf("partTable").length === PART_DOM.length
    && rowsOf("beybladeTable").every((r, i) => r === STOCK_DOM[i]) && rowsOf("partTable").every((r, i) => r === PART_DOM[i]);
  const unchanged = () => collect().json === base.json && collect().prints === base.prints && counters.saveData === 0 && sameRows();
  const desktop = innerWidth >= 821;
  const stockShown = () => [...document.querySelectorAll("#stockViewList .cv-item")].map(a => a.querySelector(".cv-code").textContent + " " + a.querySelector(".cv-title").textContent);
  const stockCodes = () => stockShown().map(t => t.split(" ")[0]);
  const partShown = () => [...document.querySelectorAll("#partViewList .cv-part-item")].map(a => a.querySelector(".cv-type").textContent + " " + a.querySelector(".cv-title").textContent);
  const settle = async () => { await frame(); await frame(); };
  const setSelect = async (id, value) => { const el = document.getElementById(id); el.value = value; el.dispatchEvent(new Event("change", { bubbles: true })); await settle(); };
  const clickChip = async value => { document.querySelector(`[data-stock-series="${value}"]`).click(); await settle(); };
  const typeSearch = async (id, q) => { const el = document.getElementById(id); el.value = q; el.dispatchEvent(new Event("input", { bubbles: true })); await settle(); };
  // The page init (not part of the sliced source) wires the type chips and the parts search
  // exactly like this: set inventoryFilterType / read the box, then applyInventoryFilters().
  document.querySelectorAll("[data-inventory-filter]").forEach(button => button.addEventListener("click", () => {
    api.setFilter(button.dataset.inventoryFilter || "all");
    document.querySelectorAll("[data-inventory-filter]").forEach(c => { c.classList.toggle("active", c === button); c.setAttribute("aria-pressed", String(c === button)); });
    api.applyInventoryFilters();
  }));
  document.getElementById("inventorySearchInput").addEventListener("input", () => api.applyInventoryFilters());
  const TABLE_ORDER = ["UX-01", "BX-00", "BX-00", "BX-01", "BX-01", "BX-04", "CX-03"];

  // Controls appear once the display layer runs.
  check("controls visible", !document.querySelector('[data-list-controls="stock"]').hidden && !document.querySelector('[data-list-controls="parts"]').hidden);
  const toggle = document.querySelector("#collectionSection [data-view-toggle]");
  check("V3 toggle only on desktop", desktop ? getComputedStyle(toggle).display !== "none" : getComputedStyle(toggle).display === "none", getComputedStyle(toggle).display);
  check("V3 default list mode", document.getElementById("stockViewList").dataset.viewMode === "list" && document.getElementById("partViewList").dataset.viewMode === "list");
  api.setCollectionTab("stock"); await settle();
  const listLayout = () => getComputedStyle(document.querySelector("#stockViewList .cv-item")).borderTopLeftRadius === "0px";
  check("V3 list layout on desktop, cards on phones", desktop ? listLayout() : !listLayout(), getComputedStyle(document.querySelector("#stockViewList .cv-item")).borderTopLeftRadius);
  check("default stock order = table order (sortTable)", JSON.stringify(stockCodes()) === JSON.stringify(TABLE_ORDER) && JSON.stringify(STOCK_DOM.map(r => r.cells[0].innerText)) === JSON.stringify(TABLE_ORDER), JSON.stringify(stockShown()));
  check("stock count text", text("stockListStatus") === "顯示 7 / 7 顆", text("stockListStatus"));

  // Series / source / sort.
  await clickChip("BX");
  check("series BX", JSON.stringify(stockCodes()) === JSON.stringify(["BX-00", "BX-00", "BX-01", "BX-01", "BX-04"]) && text("stockListStatus") === "顯示 5 / 7 顆" && document.querySelector('[data-stock-series="BX"]').getAttribute("aria-pressed") === "true", JSON.stringify(stockShown()));
  await clickChip("CX");
  check("series CX", JSON.stringify(stockCodes()) === JSON.stringify(["CX-03"]));
  await clickChip("all");
  await setSelect("stockSourceFilter", "manual");
  check("source manual", JSON.stringify(stockShown()) === JSON.stringify(["BX-04 騎士重盾"]), JSON.stringify(stockShown()));
  await setSelect("stockSourceFilter", "auto");
  check("source auto", stockShown().length === 6 && !stockShown().includes("BX-04 騎士重盾"));
  await setSelect("stockSourceFilter", "all");
  await setSelect("stockSortSelect", "model");
  check("sort model", JSON.stringify(stockCodes()) === JSON.stringify(["BX-00", "BX-00", "BX-01", "BX-01", "BX-04", "CX-03", "UX-01"]), JSON.stringify(stockShown()));
  await setSelect("stockSortSelect", "name");
  const names = stockShown().map(t => t.split(" ").slice(1).join(" "));
  check("sort name", names.every((n, i) => i === 0 || names[i - 1].localeCompare(n, "zh-Hant", { numeric: true, sensitivity: "base" }) <= 0), JSON.stringify(names));
  check("display-only so far: data, fingerprints and row order unchanged, no save", unchanged());

  // Combination: search + series + source + sort.
  await typeSearch("stockSearchInput", "3-60");
  await clickChip("BX");
  await setSelect("stockSourceFilter", "auto");
  await setSelect("stockSortSelect", "model");
  check("combo search 3-60 + BX + auto + model", JSON.stringify(stockShown()) === JSON.stringify(["BX-01 蒼龍神劍", "BX-01 蒼龍神劍"]), JSON.stringify(stockShown()));
  check("combo count text", text("stockListStatus") === "顯示 2 / 7 顆", text("stockListStatus"));
  await clickChip("UX");
  check("combo with no match shows the notice", stockShown().length === 0 && /沒有符合條件的收藏/.test(document.querySelector("#stockViewList .cv-notice")?.textContent || ""));
  check("combo: unchanged, no save", unchanged());

  // Row identity under filter + sort: delete the manual row shown after name sort, cancel.
  await typeSearch("stockSearchInput", "");
  await clickChip("all");
  await setSelect("stockSourceFilter", "manual");
  await setSelect("stockSortSelect", "name");
  counters.answer = false;
  document.querySelector('#stockViewList .cv-item [data-view-action="delete"]').click(); await settle();
  check("identity: the shown row is the one asked about", counters.confirms.at(-1).startsWith("確定要刪除「BX-04 騎士重盾」嗎？") && counters.confirms.length === 1, counters.confirms.at(-1));
  check("identity cancel: unchanged, no save", unchanged());

  // Parts: status + sort + type + search.
  api.setCollectionTab("parts"); await settle();
  const pm = api.computeCollectionPartsModel();
  const expectStatus = st => pm.items.filter(e => view.partStatus(e) === st).map(e => `${e.type} ${e.name}`);
  await setSelect("partStatusFilter", "over");
  check("status over (軸心 R)", JSON.stringify(partShown()) === JSON.stringify(expectStatus("over")) && partShown().includes("軸心 R"), JSON.stringify(partShown()));
  await setSelect("partStatusFilter", "usedUp");
  check("status used up (固鎖 3-60 included)", JSON.stringify(partShown()) === JSON.stringify(expectStatus("usedUp")) && partShown().includes("固鎖 3-60"), JSON.stringify(partShown()));
  await setSelect("partStatusFilter", "available");
  check("status available", JSON.stringify(partShown()) === JSON.stringify(expectStatus("available")) && !partShown().includes("軸心 R"));
  check("parts count text = P2 items", text("inventoryFilterStatus") === `顯示 ${expectStatus("available").length} / ${pm.items.length} 種`, text("inventoryFilterStatus"));
  await setSelect("partStatusFilter", "all");
  await setSelect("partSortSelect", "avail");
  const avails = [...document.querySelectorAll("#partViewList .cv-part-item")].map(a => (a.classList.contains("is-over") ? -1 : 1) * Number(a.querySelector(".cv-avail dd").textContent));
  check("sort available fewest first", avails.every((v, i) => i === 0 || avails[i - 1] <= v) && partShown()[0] === "軸心 R", JSON.stringify(avails));
  document.querySelector('[data-inventory-filter="軸心"]').click(); await settle();
  await typeSearch("inventorySearchInput", "f");
  check("parts combo type 軸心 + search f + sort", JSON.stringify(partShown()) === JSON.stringify(["軸心 F"]), JSON.stringify(partShown()));
  check("parts combo: unchanged, no save, original rows not hidden or reordered", unchanged() && PART_DOM.every(r => !r.hidden && r.style.order === ""));

  // Identity: under the parts combo delete the 2nd F extra row, cancel.
  counters.answer = false;
  document.querySelectorAll('#partViewList [data-view-action="delete"]')[1].click(); await settle();
  check("parts identity: asks about the 2nd F row", counters.confirms.at(-1) === "確定要刪除「軸心：F，數量 3」嗎？", counters.confirms.at(-1));
  check("parts identity cancel: unchanged", unchanged());

  // V3 switch, storage, storage failure.
  const btnCard = document.querySelector('#inventorySection [data-view-mode="card"]');
  btnCard.click(); await settle();
  check("V3 card: both lists switch and the preference is stored", document.getElementById("stockViewList").dataset.viewMode === "card" && document.getElementById("partViewList").dataset.viewMode === "card" && localStorage.getItem("beybladeCollectionViewMode") === "card" && btnCard.getAttribute("aria-pressed") === "true");
  const origGet = Storage.prototype.getItem, origSet = Storage.prototype.setItem;
  Storage.prototype.getItem = () => { throw new Error("blocked"); };
  Storage.prototype.setItem = () => { throw new Error("blocked"); };
  let storageOk = true;
  try {
    storageOk = api.readStoredViewMode() === "list";
    document.querySelector('#collectionSection [data-view-mode="list"]').click(); await settle();
    storageOk = storageOk && document.getElementById("stockViewList").dataset.viewMode === "list" && document.querySelectorAll("#partViewList .cv-part-item").length > 0;
  } catch (error) { storageOk = false; }
  Storage.prototype.getItem = origGet; Storage.prototype.setItem = origSet;
  check("B-05 storage errors: falls back to the list and keeps working", storageOk);
  check("V3 switching: unchanged, no save", unchanged());

  // Account change resets filters and sorting, not V3.
  document.querySelector('#collectionSection [data-view-mode="card"]').click(); await settle();
  api.resetCollectionViewState(); await settle();
  const st = api.state();
  check("account reset: controls back to default", JSON.stringify(st.controls) === JSON.stringify(view.defaultListControls())
    && document.getElementById("stockSourceFilter").value === "all" && document.getElementById("stockSortSelect").value === "default"
    && document.getElementById("partStatusFilter").value === "all" && document.getElementById("partSortSelect").value === "default"
    && document.querySelector('[data-stock-series="all"]').getAttribute("aria-pressed") === "true"
    && document.querySelector('[data-inventory-filter="all"]').getAttribute("aria-pressed") === "true"
    && document.getElementById("stockSearchInput").value === "" && document.getElementById("inventorySearchInput").value === "", JSON.stringify(st.controls));
  check("account reset keeps the V3 preference", st.viewMode === "card");
  check("account reset: parts list back to full", partShown().length === pm.items.length);
  api.setCollectionTab("stock"); await settle();
  check("account reset: stock list back to table order", JSON.stringify(stockCodes()) === JSON.stringify(TABLE_ORDER));
  localStorage.removeItem("beybladeCollectionViewMode");

  // Confirm path under a filter + sort: delete BX-04.
  await setSelect("stockSourceFilter", "manual");
  await setSelect("stockSortSelect", "name");
  counters.answer = true;
  const bx04 = STOCK_DOM.find(r => r.cells[0].innerText === "BX-04");
  document.querySelector('#stockViewList .cv-item [data-view-action="delete"]').click(); await settle();
  const rest = STOCK_DOM.filter(x => x !== bx04);
  check("confirm path: exactly BX-04 removed, one save, other rows keep order", !bx04.isConnected && counters.saveData === 1
    && rowsOf("beybladeTable").length === rest.length && rowsOf("beybladeTable").every((r, i) => r === rest[i]));

  check("layout no horizontal overflow", document.documentElement.scrollWidth <= innerWidth + 1, `${document.documentElement.scrollWidth}/${innerWidth}`);
  report({ ok: true, checks });
} catch (error) {
  report({ ok: false, error: String(error && error.stack || error), checks });
}
</script>
</body>
</html>
